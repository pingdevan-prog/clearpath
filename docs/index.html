Theatre Arts I is an introductory level course that teaches an overview of the theatre and serves as a foundation for all other theatre studies. Students will study basic performance techniques as well as the role of the technical elements in the theatre in an effort to communicate the significance of collaboration when interpreting theatrical literature. Studies will include all aspects of taking a play from page to stage, basic acting technique, stage movement, dramatic structure, improvisation, character and script analysis, and theatre history. For some, the course will serve as an appreciation course that counts as a fine arts credit. For others it will be the basis for deciding what type of further participation in the theatre the student might pursue.`},{id:"theatre-arts-ii",name:"Theatre Arts II",code:"PA517",dept:"Fine Arts",group:"Theatre Arts",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Theatre Arts I",note:"Director approval",summary:"Theatre Arts II is a performance-based course emphasizing ensemble work. Students will study improvisational theatre, musical theater, acting techniques, modern drama, ensemble building, theatre history, audition repertoire, and children's theatre. This course is excellent preparation for participation in department productions and only those students serious about performing should take it. Some time outside of class may be required for performances."},{id:"theatre-arts-iii",name:"Theatre Arts III",code:"PA519",dept:"Fine Arts",group:"Theatre Arts",level:"On-level",grades:[11,12],credits:[1],prereq:"Theatre Arts II",note:"Director approval",summary:`Theatre Arts III is a performance lab emphasizing ensemble work. Students will have the opportunity to explore and experience improvisational theatre, theatre history, theatrical design, audition and resume preparation, musical theatre and children's theatre by working "troupe style" and preparing productions to travel to other performance sites. This course is excellent preparation for participation in department productions, as well as college course work, auditions, and portfolio work. Only those students serious about their continued studies in theatre arts (performance, production, design, playwriting, etc) should enroll. Students enrolled in Theatre III will be expected to participate in the UIL One Act Play contest production during the spring semester. Some time outside of class will be required for performances..`},{id:"theatre-arts-iv",name:"Theatre Arts IV",code:"PA515",dept:"Fine Arts",group:"Theatre Arts",level:"On-level",grades:[12],credits:[1],prereq:"Theatre Arts III",note:"Director approval",summary:`Theatre Arts IV is a continuation of Theatre Arts III's performance lab emphasizing ensemble work. Students will have the opportunity to explore and experience improvisational theatre, theatre history, theatrical design, audition and resume preparation, musical theatre and children's theatre by working "troupe style" and preparing productions to travel to other performance sites. This course is excellent preparation for participation in department productions, as well as college course work, auditions, and portfolio work. Only those students serious about their continued studies in theatre arts (performance, production, design, playwriting, etc) should enroll. Students enrolled in Theatre IV will be expected to participate in the UIL One Act Play contest production during the spring semester. Students at this level must also take on directing roles within the troupe as approved and/or directed by the instructor. Students at this level may also propose their own ensemble performance projects to be presented in the main stage student-directed series. Some time outside of class will be required for performances.`},{id:"ap-2-d-art-and-design",name:"AP 2-D Art and Design",code:"VA009",dept:"Fine Arts",group:"Visual Arts",level:"AP",grades:[12],credits:[1],prereq:"Art III or Digital Art & Media III",note:"Instructor approval required",fee:!0,summary:`Materials fee: $25.00 & AP exam fee for portfolio submission

The focus of this course is the creation, development, and ultimately, submission of a unique, quality portfolio to the College Board after an in-depth exploration of media and completion of drawings which may include paintings, print-making, digital media, collage, and mixed media works. This class is designed for the art student who is seriously interested in immersing him or herself in a practical experience of art, creating a college art portfolio, and possibly considering advanced study of art at the college level. Advanced Placement Studio Art is not based on a written examination; instead students submit portfolios for evaluation in May. The portfolio is structured around a sustained investigation and a group of selected works. The 2D portfolio will include works in a wide and diversified range of areas including drawing, color design and computer graphic work. Students will be required to put additional time in projects outside of the classroom. In conjunction with the portfolio work students will develop works for exhibition and competition on regional, state and national levels. Grading will be based on participation and performance skills in addition to projects, assignments and final portfolio review. For more information on AP Studio Art course requirements, go to the College Board website:

http://apcentral.collegeboard.com/apc/public/courses/descriptions/index.html`},{id:"ap-3d-art-and-design-ceramics",name:"AP 3D Art and Design (Ceramics)",code:"VA010",dept:"Fine Arts",group:"Visual Arts",level:"AP",grades:[12],credits:[1],prereq:"Art III-Ceramics II and a submission of a portfolio to the Visual Arts teacher prior to the year taking the course",note:"Instructor approval required",fee:!0,summary:`Materials fee: $45.00 & AP exam fee for portfolio submission

The focus of this course is the creation, development, and ultimately, submission of a portfolio to the College Board after an in-depth exploration and completion of two series of sculptures. The portfolio is organized using a three section structure, with contents demonstrating concentration, breadth, and quality. The portfolio is structured around a sustained investigation and a group of selected works. In conjunction with the portfolio work students will develop works for exhibition and competition on regional, state and national levels. Grading will be based on participation and performance skills in addition to projects, assignments, quizzes and final portfolio review. The student must also be prepared to spend an additional number of hours outside of class time on the creation and production of original work. For more information on AP Studio Art course requirements, go to the College Board website:

http://apcentral.collegeboard.com/apc/public/courses/descriptions/index.html`},{id:"ap-3d-art-and-design-sculpture",name:"AP 3D Art and Design (Sculpture)",code:"VA008",dept:"Fine Arts",group:"Visual Arts",level:"AP",grades:[12],credits:[1],prereq:"Art Foundations I, Art III— Sculpture II and III, and a submission of a portfolio to the Visual Arts teacher prior to the year taking the course",note:"Instructor approval required",fee:!0,summary:`Materials fee: $45.00 & AP exam fee for portfolio submission

This class is designed for the art student who is seriously interested in the practical experience of art. AP 3D Art & Design is not based on a written examination; instead, students submit portfolios for evaluation at the end of the school year. The focus of this course is the creation, development, and ultimately, submission of a portfolio to the College Board after an in-depth exploration and completion of two series of 3D artworks. The portfolio is structured around a sustained investigation and a group of selected works. This course is for highly motivated students who have proven that they can work independently in the studio classroom setting. The student must also be prepared to spend an additional number of hours outside of class time on the creation and production of original 3D artwork. Grading will be based on participation and performance skills in addition to projects, assignments, quizzes and final portfolio review. In conjunction with the portfolio development, students will develop artworks for exhibition and competition on regional, state, and national levels. Precaution: Students will occasionally be using hot glue guns, heat guns, x-acto knives, utility knives, drills, saws, chisels, files, rasps, broken glass, and other tools; safety precautions will be taught and are of utmost importance. For more information on AP Studio Art course requirements, go to the College Board website:http://apcentral.collegeboard.com/apc/public/courses/descriptions/index.html`},{id:"ap-drawing",name:"AP Drawing",code:"VA011",dept:"Fine Arts",group:"Visual Arts",level:"AP",grades:[12],credits:[1],prereq:"Art III or Digital Art & Media III",note:"Instructor approval required",fee:!0,summary:`Materials fee: $25.00 & AP exam fee for portfolio submission

The focus of this course is the creation, development, and ultimately, submission of a unique, quality portfolio to the College Board after an in-depth exploration of media and completion of drawings which may include paintings, print-making, digital media, collage, and mixed media works. This class is designed for the art student who is seriously interested in immersing him or herself in a practical experience of art, creating a college art portfolio, and possibly considering advanced study of art at the college level. Advanced Placement Studio Art is not based on a written examination; instead students submit portfolios for evaluation in May. The portfolio is structured around a sustained investigation and a group of selected works. The 2D portfolio will include works in a wide and diversified range of areas including drawing, color design and computer graphic work. Students will be required to put additional time in projects outside of the classroom. In conjunction with the portfolio work students will develop works for exhibition and competition on regional, state and national levels. Grading will be based on participation and performance skills in addition to projects, assignments and final portfolio review. For more information on AP Studio Art course requirements, go to the College Board website:

http://apcentral.collegeboard.com/apc/public/courses/descriptions/index.html`},{id:"art-i-digital-art-and-media",name:"Art I: Digital Art and Media",code:"VA023",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"Basic computer skills",summary:"This course is an introduction to basic art processes and principles using the computer as the main source of medium. Students will learn about the creative process through the production of art created directly on the computer through manipulation of the student's original drawings or ideas. Students will be instructed in the use of professional drawing programs like Adobe Photoshop, Animate and Character Animator. Emphasis is placed on individual conceptualization. Elements and principles of art will be studied as required by the TEKS for Art I, and practical manipulation of these principles will be expanded using various software. This course combines a rigorous and relevant experiential study of modern, post-modern, and contemporary visual art and animation with student learning in media literacy and technology applications. Creation and analysis of student artwork will be balanced with exploration of contemporary practices across the digital and animation arts fields. Students will learn how to bridge traditional hand skills with current technology applications to create new media such as animations, digital images, multimedia presentations, motion graphics. Student work will culminate in a project that investigates relevant issues of the individual student that uses art, design, animation and visual communication to address the issue."},{id:"art-i-foundations-of-art-with-emphasis-on-painting-and-drawing",name:"Art I: Foundations of Art with Emphasis on Painting and Drawing",code:"VA001",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Materials fee $25.00",fee:!0,summary:"This course is an introductory level art class that will place emphasis on drawing and painting techniques and media, while also introducing students to the elements and principles of art and design. However, students will also be exposed to and experiment with some 3D art techniques and media so as to provide a solid foundation in a wide variety of studio art experiences. Students will learn about and experience the creative process primarily through the media of drawing, painting, printmaking, and mixed media, with some limited exposure and experience with ceramics and sculpture. Students will develop and maintain a sketchbook which will house students' preliminary sketches, media experimentation and art historical inspiration. In addition, students will explore art history as it pertains to our projects and learn critical analysis methods for evaluating their own and others work."},{id:"art-i-foundations-of-art-with-emphasis-on-sculpture-and-ceramics",name:"Art I: Foundations of Art with Emphasis on Sculpture and Ceramics",code:"VA001B",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Materials fee $25.00",fee:!0,summary:"This course is an introductory level art class that will place emphasis on ceramics and sculpture techniques and media, while also introducing students to the elements and principles of art and design. However, students will also be exposed to and experiment with some 2D art techniques and media so as to provide a solid foundation in a wide variety of studio art experiences, and to aide in conceptualization of 3D pieces. Students will learn about and experience the creative process primarily through a wide variety of sculptural media, including clay, wire, wood, paper mache, plaster, and mixed media, with some limited exposure and experience with drawing and painting. Students will develop and maintain a sketchbook which will house students' preliminary sketches, media experimentation, and art historical inspiration. In addition, students will explore art history as it pertains to our projects and learn critical analysis methods for evaluating their own and others work. Students will be expected to work as a classroom community to help maintain the studio space as well as maintain the tools and equipment that we use. Precaution: Students will be working with potentially dangerous tools, such x-acto knives, hammers, chisels, saws, heat guns, drills, etc."},{id:"art-ii-ceramics",name:"Art II: Ceramics",code:"VA013",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Art I-Foundations of Studio Art",note:"Materials fee $45.00",fee:!0,summary:"This course is an introduction to the basic history, practice, and techniques of working in ceramics. Students will continue their study of the elements and principles of art, art history and appreciation. Students will also continue to study and develop their own creative process through the production of 3-dimensional art, producing functional and nonfunctional art. Students will learn both hand-building and wheel-thrown techniques. Major projects are designed to be conceptual/open-ended in nature, encouraging students to make decisions and take risks. The emphasis is on art elements and principles as well as on creative visual thinking and problem-solving. Strong importance is placed on individual conceptualization in students' projects, as well as on classroom participation, and students working within a community to contribute to and maintain a large studio lab. Precaution: Students will occasionally be using heat guns, needle tools, x-acto knives, chisels, and broken glass; safety precautions will be taught and are of utmost importance."},{id:"art-ii-digital-art-and-media",name:"Art II: Digital Art and Media",code:"VA025",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Art and Media Communications I",summary:`This course is designed for students who are interested in developing 2D and 3D graphics to be used in advertising and desktop publishing. Students will be instructed in the use of professional drawing programs like Adobe Illustrator, Photoshop, and After Effects, as well 3D applications such as Lightwave 3D and ZBrush.

Digital Art and Media I builds upon the foundation skills taught in the Art and Media Communications I survey course, and provides opportunities for students to apply knowledge of contemporary visual art and design practices with greater depth and complexity. Hands-on, experiential learning in visual art is interwoven with technology applications, media literacy, and 21st century skills as students explore participatory media and the practice of transmedia storytelling. Students learn how new media such as digital imagery, multimedia presentations, special video effects, game design, and animations intersect with contemporary art—specifically sculpture—in the use of ZBrush. By creating transmedia stories about their work, students expand both personal and collective narratives, deepen creative research skills, gain insight into messaging platforms, and build communities of interest. Students will document their work in a professional-level digital portfolio that demonstrates their progress through all phases of the creative process.`},{id:"art-ii-dimensional-design-sculpture-1",name:"Art II: Dimensional Design & Sculpture 1",code:"VA002",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Art I—Foundations of Studio Art",note:"Materials fee $45.00",fee:!0,summary:`This course will teach students how to think and design three-dimensionally and present a finished product. It will reinforce the sculptural concepts learned in Art 1, while allowing students to experiment with new materials and a variety of three-dimensional problems. Students will be given the opportunity to imagine, plan, sketch, design, and create such things as figurative and abstract sculptures, as well as less conventional projects such as innovative furniture, "extreme" houses, or vehicles of the future. Major projects are designed to be conceptual/open-ended in nature, encouraging students to make decisions and take risks. The emphasis is on art elements and principles as well as on creative visual thinking and problem-solving. Strong importance is placed on individual conceptualization in students' projects, as well as on classroom participation, and students working within a community to contribute to and maintain a large studio lab. We will be using such materials as plaster, plaster gauze, papier mache, clay, foam-board, wood, found objects, fabric, mat-board, etc. Sketchbooks will be an integral part of the class for planning work, recording material experimentation results, and designing. Collaboration with peers and faculty, communication between students, student and teacher will be expected, and personal growth through creativity will be fostered.

Precaution: Students will occasionally be using hot glue guns, heat guns, x-acto knives, utility knives, drills, saws, chisels, files, rasps, and other tools; safety precautions will be taught and are of utmost importance.`},{id:"art-ii-studio-painting-drawing",name:"Art II: Studio Painting & Drawing",code:"VA003",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Art I: Foundations of Art with Emphasis on Painting and Drawing",note:"Materials fee $25.00",fee:!0,summary:"This course is designed for the motivated art student who has successfully completed both semesters of Art I. It builds upon the basic skills and techniques taught and mastered in this beginning course. Students will be encouraged to work from observation and will be introduced to advanced colored pencil, painting, printmaking and mixed media techniques. The creative process will be stressed through the use of a developmental sketchbook which will house students' preliminary sketches, media experimentation, art historical inspiration, etc. Major projects are designed to be conceptual/open-ended in nature, encouraging students to make decisions and take risks. The emphasis is on art elements and principles as well as on creative visual thinking and problem-solving. This course offers not only hands-on production but the study of art history and the process of critical analysis in reference to viewing professional and student artwork. Students will be expected to develop work for exhibition and/or competition."},{id:"art-ii-studio-photography",name:"Art II: Studio Photography",code:"VA035",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Art I",note:"Materials fee $35.00",fee:!0,summary:"This course is designed for students who are interested in developing their craft of photography. Students will learn and expand on camera usage, both 35mm film and DSLRs, use Adobe photo editing software and hone darkroom skills. The elements and principles of fine art, student knowledge and practical manipulation of the principles of art will be expanded. This is a project-based course designed to take the student through all phases of the creative process, from beginning to end. Art history and art appreciation will be taught on more traditional art topics and current trends."},{id:"art-iii-ceramics",name:"Art III: Ceramics",code:"VA015",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Art II: Ceramics",note:"Materials fee $45.00",fee:!0,summary:"This course is a continuation of the basic art processes and techniques learned in Art II—Ceramics, as students learn to combine and refine their technical approaches with increased emphasis on individual conceptualization within project design. Projects may include a variety of media within the work, as well as art history and art appreciation. This course requires increased independence and self-motivation as projects grow in complexity, and will likely require time outside of class to be completed. Students are expected to continue to develop skills and begin to combine methods with growing precision, working within a community to contribute to and maintain a large studio lab. Precaution: Students will occasionally be using heat guns, needle tools, x-acto knives, chisels, and broken glass; safety precautions will be taught and are of utmost importance."},{id:"art-iii-digital-art-and-media",name:"Art III: Digital Art and Media",code:"VA026",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[11,12],credits:[1],prereq:"Digital Art and Media I",summary:"This course is designed for students who have completed Digital Art and Media I and want to continue their study of 3D computer graphics. Digital Art and Media II builds upon the foundation skills taught in the Digital Art and Media I course, and provides opportunities for students to apply knowledge of contemporary visual are and design practices with greater depth and complexity. Students will be instructed in the use of professional drawing programs like Adobe Illustrator, Photoshop After Effects, LightWave, and ZBrush with much greater emphasis on individual conceptualization and development of the medium. Students must have previously demonstrated self-motivation and commitment to the field of computer graphics and be willing to put extra time and effort into developing good graphic techniques. Students will explore individual direction in the design and creation of original images for exhibitions, publications and personal portfolios. Students' knowledge and practical manipulation of the principles of art will be expanded. Work produced on the computer can be included in the student's AP Studio Art 2D Portfolio."},{id:"art-iii-sculpture",name:"Art III: Sculpture",code:"VA031",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[11,12],credits:[1],prereq:"Art I Foundations and Art II: Sculpture",note:"Materials fee $45.00",fee:!0,summary:"This three-dimensional design and sculpture course is designed for the motivated student-artist who is interested in furthering investigations into product, furniture, vehicle, architectural design, as well as more traditional sculpture studies. At this level, the student will respond to a series of teacher-generated prompts, while having a chance to work on areas of personal interest to produce a finished product. Students will be working with a variety of media and techniques. They will have more independence (than in Art Level 1 and 2 classes) in the choice of subject, medium, and materials to be used. A sketchbook will be an important tool used in this class for sketching, rendering designs, writing critiques, and investigations into art history. Collaboration with peers and faculty, communication between students, student and teacher will be expected, and personal growth through creativity will be fostered. . Precaution: Students will occasionally be using hot glue guns, heat guns, x-acto knives, utility knives, drills, saws, chisels, files, rasps, and other tools; safety precautions will be taught and are of utmost importance."},{id:"art-iii-studio-drawing",name:"Art III: Studio Drawing",code:"VA004",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[11,12],credits:[1],prereq:"Art II: Studio Painting & Drawing",note:"Materials fee $25.00",fee:!0,summary:"This course is designed for the advanced and highly motivated art student who wants to specialize in drawing using a variety of drawing mediums such as pen and ink, colored pencil, graphite, conte crayon, oil pastels, charcoal, etc. Students will be encouraged to work from observation while exploring individual directions in the design, development and creation of original drawings for exhibitions/competitions, publications and personal/AP portfolios. Their knowledge of the elements and principles of art, along with art vocabulary, technique and research into past and post-contemporary art will continue to be expanded."},{id:"art-iii-studio-painting",name:"Art III: Studio Painting",code:"VA006",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[11,12],credits:[1],prereq:"Art II: Studio Painting & Drawing",note:"Material fee $25.00",fee:!0,summary:"This class is designed for the advanced and highly motivated art student who wants to specialize in painting. All mediums such as watercolor, acrylic, oils and mixed media will be utilized. Students will be encouraged to work from observation while exploring individual directions in the design, development and creation of original paintings for exhibitions/competitions, publications and personal/AP portfolios. Their knowledge of the elements and principles of art, along with art vocabulary, technique and research into past and post-contemporary art will continue to be expanded."},{id:"art-iv-drawing-painting-iii",name:"Art IV — Drawing / Painting III",code:"VA011G",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[12],credits:[1],prereq:"Art III—Drawing II or Painting II and Instructor Approval",note:"Material fee $25.00",fee:!0,summary:"This course is designed for the highly motivated, creative and skilled art student who can work independently and self-manage time frames for meeting project deadlines. A student taking this course may not be interested in the intense workload of creating and developing the required portfolio of work the Advanced Placement Art courses require, but may instead be interested in developing a portfolio for college preparation. Students will be required to complete a minimum of six major artworks in this course. Requirements include preliminary work/sketches for projects, experimentation with media, art history research, visits to art galleries and museums, and class and individual instructor critiques. Mastery of working from observation, composition and technique, and developing work for exhibition and competition is expected."},{id:"art-iv-ceramics",name:"Art IV: Ceramics",code:"VA017",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[11,12],credits:[1],prereq:"Art III: Ceramics and Instructor Approval",note:"Materials fee $45.00",fee:!0,summary:"This class is designed for the advanced art student who wants to specialize in ceramics. The student will have the opportunity to explore, in depth, more challenging and sophisticated construction and decoration techniques. All ceramic methods will be used, but with greater emphasis on combining methods and the development of surfaces. Students will develop a deeper understanding of an artist's conceptualization. Students will be expected to develop a creative, quality, and cohesive body of work for submission in a college portfolio. The students must have previously demonstrated to the teacher self-motivation and commitment and must continue to develop all ceramic methods skills. As projects grow in complexity, pieces will likely require time outside of class in order to be completed. Students will work within a community to contribute to and maintain a large studio lab. Precaution: Students will occasionally be using heat guns, needle tools, x-acto knives, chisels, and broken glass; safety precautions will be taught and are of utmost importance."},{id:"art-iv-digital-art-and-media",name:"Art IV: Digital Art and Media",code:"VA028",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[12],credits:[1],prereq:"Art III—Digital Art and Media II",note:"Instructor approval required",summary:"This course is designed for independent-minded students who have completed Art III—Digital Art and Media II, and who want to continue their study of 3D computer graphics. Digital Art and Media III builds upon the foundation skills taught in the Digital Art and Media II course and provides opportunities for students to apply knowledge of contemporary visual art and design practices with greater depth and complexity. Students will continue their study of professional drawing programs like Adobe Illustrator, Photoshop After Effects, Light-Wave, and ZBrush with a much greater emphasis on individual conceptualization and development of the medium. Students must have previously demonstrated self-motivation and commitment to the field of computer graphics and be willing to put extra time and effort into developing good graphic techniques. Students will explore individual direction in the design and creation of original images for exhibitions, publications and personal portfolios. Work produced on the computer can be included in the students AP Art 2D portfolio."},{id:"art-iv-sculpture",name:"Art IV: Sculpture",code:"VA034",dept:"Fine Arts",group:"Visual Arts",level:"On-level",grades:[12],credits:[1],prereq:"Art 1: Foundations and Art III: Sculpture",note:"Materials fee $45.00",fee:!0,summary:`This advanced three-dimensional design and sculpture course is designed for the highly motivated student-artist who is interested in developing skills and furthering studies into various forms of product, furniture, vehicle, architectural design, and more traditional forms of sculpture. Students will be expected to develop a creative, quality, and cohesive body of work for submission in a college portfolio. Along with the development of the portfolio, a detailed sketchbook will be maintained for completing art historical investigations, sketching and rendering ideas, and writing critiques. Choices in subject, media, and technique will be given. Regular meetings with individual students will help guide the students to pursue a thematic sculptural strand. Collaboration with peers and faculty, communication between students, student and teacher will be expected, and personal growth through creativity will be fostered.

Precaution: Students will occasionally be using hot glue guns, heat guns, x-acto knives, utility knives, drills, saws, chisels, files, rasps, and other tools; safety precautions will be taught and are of utmost importance.`},{id:"3d-modeling-animation",name:"3D Modeling & Animation",code:"700B",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[11,12],credits:[1],prereq:"Digital Graphics & Animation 2",summary:"This course is designed for students who have completed Digital Graphics & Animation 1 and Digital Graphics & Animation 2. Students taking this course have mastered skills taught in previous courses. Independent Study in Digital Graphics allows students to build portfolios and gain a deep knowledge of software in Adobe Photoshop, Adobe Animate, and 3D Maya. Students will develop and create new original art for their online portfolio in preparation for college. This course is a fine arts credit."},{id:"architecture-and-interior-design",name:"Architecture and Interior Design",code:"TC714",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[10,11,12],credits:[1],prereq:"None",summary:"Architecture and Interior Design is a technical course that addresses the psychological, physiological and sociological needs of individuals by enhancing the environments in which they live and work. Students will study concepts and tools related to interior and exterior environments, construction, and furnishings to make wise consumer decisions. This project-oriented course addresses current design practices and influences of technology on home design. Students will develop a portfolio featuring original work using a variety of 2D and 3D software including SketchUp, Chief Architect and Revit to create and develop plans for buildings and interiors."},{id:"digital-graphics-and-animation-i",name:"Digital Graphics and Animation I",code:"TC701",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Articulated College Credit when taken in 9th or 10th grade",flags:["Articulated College Credit"],summary:"Digital Graphics and Animation is a hands-on lab-based course where students are introduced to various Graphic Design, 3D Modeling, and Animation skills. This course will allow students to demonstrate creative thinking and develop innovative projects in Adobe Photoshop, 3D Maya, Adobe Animate, and Adobe After Effects. The course covers how to create, edit, and take apart 3D models and animations using industry standard software. Students learn foundation skills to work, create, and navigate utilizing the features of the digital 3D modeling and animation work space. Digital Graphics and Animation is a project-oriented class that stimulates the creative side."},{id:"digital-graphics-and-animation-ii",name:"Digital Graphics and Animation II",code:"TC703",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Digital Graphics & Animation I",summary:"Digital Graphics & Animation II is a second-year course in which students will focus on the development of advanced skills as they plan, design and create interactive projects using elements including, 2-D and 3-D graphics, animation, digital imaging, and interactive projects. The class will allow the students to advance their skills and build portfolios, to prepare for success in college courses as they begin their first career."},{id:"editorial-leadership-i-ii-iii",name:"Editorial Leadership I, II, & III",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"Honors",grades:[10,11,12],credits:[1],prereq:"Students must have completed one year in a high school journalism course. These may not be taken concurrently",alsoIn:["Language Arts"],flags:["Elective","New Course"],summary:`YEARBOOK - I (LA151), II (LA153), III (LA158)

NEWSPAPER - I (LA169), II (LA175), III (LA179)

Students in Editorial Leadership I, II, III will continue to use skills learned in Yearbook, Newspaper, or Photojournalism. Students who make the decision to apply for and accept an editor position take on the responsibility to lead the staff and class in the production of the publication. Editors will meet the requirements of advanced journalism publications courses, and they will also have additional responsibilities as editors. Students and parents should realize the added responsibilities mean additional time after school must be devoted to complete tasks and meet deadlines.

Student editors work independently and oversee adherence to preset deadlines. They will lead and mentor other staff members in the development of the publication in areas such as interviewing, writing, copy editing, photographing, illustrating, designing, distributing and selling yearbooks; commit to the hours necessary outside of class to complete tasks; be willing and able to work closely with peers as a team; and possess good communication skills. These students will make critical decisions about the content of the publication, create systems to make class processes efficient, troubleshoot technology issues. In addition to this, they gain a working knowledge of industry standard software including InDesign and Photoshop`},{id:"fashion-design",name:"Fashion Design",code:"TC712",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[10,11,12],credits:[1],prereq:"None",summary:`This laboratory course focuses on careers in the fashion and textile/apparel industries. Students will be exposed to the apparel production process from design concept to finished product. Course content includes apparel construction, care, and maintenance. Learning activities include researching current fashion and exploring the fashion industry, producing residential and personal fashion items, sewing and tailoring techniques and individual color and fashion design analysis. No sewing knowledge is required for this course; students advance at their individual level.

The American Association of Family and Consumer Science (AAFCS) pre-professional certification may be earned during this course.`},{id:"film-1-film-production",name:"Film 1 - Film Production",code:"TC775",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Articulated Credit",flags:["Articulated College Credit"],summary:"Film Production is a fun hands-on course in film theory and digital video production. Students gain fundamental industry skills in visual storytelling, scriptwriting, producing, directing, production design, cinematography, sound mixing, and post-production. They collaborate in small crews and use professional equipment and software to write, plan, shoot, and edit short films, trailers, music videos, stop motion animations, and more."},{id:"film-2-advanced-film-production",name:"Film 2 - Advanced Film Production",code:"TC774",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Film Production",summary:"Advanced Film Production students sharpen industry skills learned to create high-end digital video projects and more ambitious films. They collaborate in larger crews, film at off-campus locations, operate professional equipment and employ advanced techniques to grow their work. In turn, students grow as filmmakers by critically examining basic film elements (narrative, cinematography, sound, mise-en-scene, editing, etc.) through participation in film challenges, select screenings, lively discussions, and video essays."},{id:"film-3-advanced-film-portfolio",name:"Film 3 - Advanced Film Portfolio",code:"TC102",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[11,12],credits:[1],prereq:"Advanced Film Production & Teacher approval",summary:"Advanced Film Portfolio students enjoy the freedom to tailor the curriculum to meet their goals and interests. They pitch ideas and work independently to produce portfolio projects and films. In doing so, they exercise critical thinking, collaborate with peers, manage crew members and production schedules, and hone employable skills that ready them for college and career opportunities in film and video production. Student portfolio reels may also include practical experiences gained through film festival participation, contest entry, and critical film review."},{id:"film-4-film-mentorship",name:"Film 4 - Film Mentorship",code:"TC466T",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[11,12],credits:[1],prereq:"Advanced Film Portfolio*",summary:`Students in this advanced course accept the challenge and responsibility of producing videos for community clients. They increase their awareness of industry demands and expectations by connecting with professionals. They gain additional experience by participating in film festivals and competitions. Students demonstrate their experiential learning by maintaining a competitive reel (portfolio) and by producing a documentary-style short film about their mentorship.

*may be taken concurrently with teacher approval`},{id:"film-4-practicum-in-film-production",name:"Film 4 - Practicum in Film Production",code:"TC778",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[12],credits:[2],prereq:"Advanced Film and Teacher Approval",summary:"Practicum in Film is an advanced course designed for students interested in pursuing film or video production as a career or post-secondary course of study. Students take advantage of the small class size, extra class period, and independent structure to complete a culminating video project or thesis film. Students further their knowledge of production through participation in film festivals, competitions, screenings, panel discussions, special events, and industry mentorships."},{id:"video-game-design",name:"Video Game Design",code:"TC707",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Articulated College Credit when taken in 9th or 10th grade",flags:["Articulated College Credit"],summary:"Video games are a multi-billion dollar industry, and one of the leading forms of entertainment in the world. This course provides students with an array of skills required in this exciting industry. Students will learn concepts and tools to create levels, models, and mechanics for games and simulations using the game engine Unreal Engine. Students will also learn 3D Maya and Adobe Photoshop to create 3D and 2D assets for Unreal Engine. This is a project-oriented class that takes the student through the production process of video game development from beginning to end."},{id:"video-production-for-social-media-chap-recap",name:"Video Production for Social Media/Chap Recap",code:"TC785",dept:"Technology & Career Education",group:"Arts, A/V & Communications",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"Create engaging short-form video content for Chap Recap and @whs_chaps Instagram. As Social Media Manager, you'll build your resume, sharpen your production skills, and craft scroll-stopping content for both school and personal social media platforms. Working with campus leadership, you'll play a key role in producing the weekly video announcements. Join this dynamic crew of content creators, influencers, and campus personalities—and earn a grade for staying active on Instagram, YouTube, and other social media platforms!"},{id:"accounting",name:"Accounting",code:"TC660",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Algebra I or Concurrent Enrollment in Algebra I",note:"Articulated college credit when taken in 10th grade",flags:["Articulated College Credit"],summary:"Accounting students learn to maintain financial records for a service business, a partnership, and a corporation. Students also use Excel 2010 to solve business scenarios. Additional topics include understanding financial statements, time value of money, entrepreneurship, and personal finance. Students will learn to use QuickBooks accounting software during the second semester."},{id:"advertising",name:"Advertising",code:"TC654",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[11,12],credits:[.5],prereq:null,summary:"Advertising is designed as a comprehensive introduction to the principles and practices of advertising. Students will gain knowledge of techniques used in current advertising, including print, broadcast, and digital media. The course explores the social, cultural, ethical, and legal issues of advertising, historical influences, strategies, media decision processes as well as integrated marketing communications, and careers in advertising and sales promotion. The course provides an overview of how communication tools can be used to reach target audiences and increase consumer knowledge"},{id:"business-acceleratoredu",name:"Business ACCELeratoredu",code:"TC468",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[12],credits:[1],prereq:"Completion of Business Incubator and Teacher Approval",summary:"This full-year course is designed as a second-year program for teams that have completed Business Incubator, have received funding at Pitch Night, and are ready to launch a business. The goal is to guide students to a successful launch of their company and gain traction in the market place. The content is built from real life entrepreneurial practices, and real world business accelerator practices. Teams will continue to be supported by mentors and guided by coaches from the business world. This course receives the same weight as an Honors course."},{id:"business-incubator",name:"Business Incubator",code:"TC467",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[11],credits:[1],prereq:"Beginning with the Class of 2028, students must have successfully completed Principles of Business, Marketing, & Finance",summary:"This course is designed to get students excited about becoming true entrepreneurs by giving them the opportunity to create and fully develop their own product or service. Real-world entrepreneurs and business experts will serve as coaches and mentors, guiding student teams through the process of ideation, market research, and business plan development. Over the course of the year, student teams will learn about marketing, accounting, human resources, and the legal aspects of starting a business. They will have access to a network of professionals to further develop their skills—teamwork, problem-solving, presentation, and communication—for college and career readiness. Students will also have the opportunity to participate in Pitch Week, which will further fire the entrepreneurial spirit by putting student teams in front of actual investors so they can pitch their innovative ideas to win funding and turn their ideas into reality. Due to the collaborative nature of this course, students are expected to remain in the course for the full year and will not be allowed to switch class periods. This course receives the same weight as an Honors course."},{id:"business-law",name:"Business Law",code:"TC670A",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[11,12],credits:[1],prereq:"None",summary:"In Business Law, students analyze the social responsibility of business and industry regarding the significant issues relating to the legal environment, business ethics, torts, contracts, negotiable financial instruments, personal property, sales, warranties, business organizations, concept of agency and employment, and real property. Students apply technical skills to address business applications of contemporary legal issues. Students incorporate a broad base of knowledge that includes the legal, managerial, marketing, financial, ethical, and international dimensions of business to make appropriate business decisions."},{id:"foundations-of-business-communication-and-technologies",name:"Foundations of Business Communication and Technologies",code:"TC741",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Articulated College Credit when taken in 9th or 10th grade",flags:["Articulated College Credit"],summary:"Business Computer Information Systems prepares students with advanced technology skills required in today's business environment. Students will use the 2016 Microsoft Office suite of programs (Word, Excel, Access and Power Point) in their core business applications. Students will also be introduced to various applications that are utilized frequently within industry. Students will end the year building skills that allow them to effectively evaluate emerging technologies and their relevance to the business world."},{id:"fundamentals-of-real-estate",name:"Fundamentals of Real Estate",code:"TC680",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[11,12],credits:[2],prereq:null,note:"Students who complete this course may be eligible to pursue a Texas real estate salesperson license after meeting additional TREC requirements.",flags:["New Course"],summary:"This comprehensive course introduces students to the foundational concepts of real estate and prepares them for careers in the industry. Fundamentals of Real Estate includes all required curriculum for the Texas Real Estate Commission (TREC) pre-licensure education, covering Principles of Real Estate I & II, Law of Contracts, Law of Agency, Promulgated Contract Forms, and Real Estate Finance. Students will explore topics such as property ownership, real estate law, contracts, financing, ethics, and closing procedures. The course emphasizes professional standards, communication skills, and ethical decision-making. Hands-on activities, case studies, and simulations provide real-world applications of concepts."},{id:"principles-of-business-marketing-and-finance",name:"Principles of Business, Marketing and Finance",code:"TC651A",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"Students in Principles of Business, Marketing and Finance gain knowledge and skills in economics and private enterprise systems, the impact of global business, marketing of goods and services, advertising and product pricing. Students analyze the sales process and financial management principles. This course allows students to reinforce, apply and transfer academic knowledge and skills to a variety of interesting and relevant activities, problems, and settings in business, marketing and finance."},{id:"social-media-marketing",name:"Social Media Marketing",code:"TC654B",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[11,12],credits:[.5],prereq:null,summary:""},{id:"virtual-business",name:"Virtual Business",code:"TC655",dept:"Technology & Career Education",group:"Business & Marketing",level:"On-level",grades:[9,10,11,12],credits:[.5],prereq:null,note:"Recommended to have taken Principles of Business, Marketing & Finance",summary:"Students in Virtual Business gain knowledge and skills in economics and private enterprise systems, the impact of global business, marketing of goods and services, advertising and the operation of web-based business. Students analyze the sales process, financial management principles, and forms of business ownership and operations. Teams of students will produce their Virtual Business portfolio, which includes a business plan for an online business; creation and maintenance of their business website; and preparation and demonstrated understanding of an income statement and balance sheet."},{id:"mentorship",name:"Mentorship",code:"TC466A",dept:"Technology & Career Education",group:"Career Development",level:"On-level",grades:[11,12],credits:[1],prereq:"None",summary:`Course Requirement: Students need to have a confirmed Mentor no later than the 2nd week of school.

Mentorship is an advanced independent study course designed for students looking ahead to their futures. In this course, students find and secure a mentor in a career field of interest to them and work with that mentor to increase their understanding of the field with the goal in mind of establishing a potential future occupation. Students work in non-paid internships two hours per week in addition to completing class assignments and projects in relation to the classroom and industry. At the conclusion of the semester, students create and present a portfolio of their work in addition to a product created to demonstrate their experiential learning. Students are required to spend one full day at the placement during the Spring semester to gain greater insight into the daily tasks associated with the career field. Eanes ISD does not provide the mentor, transportation to placement sites, nor does it guarantee campus parking for students enrolled in the course. This course receives the same weight as an Honors course.`},{id:"cert-disaster-response",name:"CERT: Disaster Response",code:"TC772",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"This course will train students as first responders following a major disaster utilizing the Community Emergency Response Team (CERT) model curriculum adopted by the Federal Emergency Management Agency (FEMA). The course includes training in fire safety, medical triage, disaster psychology, search and rescue, first aid, and CPR. Students will be eligible to join the Westlake Teen CERT program upon completion."},{id:"cert-disaster-response-ii",name:"CERT: Disaster Response II",code:"TC772B",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[11,12],credits:[1],prereq:"FEMA G-317 CERT Course Completion, FEMA IS-100 and FEMA IS-200 certificates of completion",summary:"CERT II- Advanced Disaster Response course includes advanced life-saving skills techniques in triage, CPR, search & rescue. Students will receive education, training, and volunteer service to make communities safer, stronger, and better prepared to respond to the threats of terrorism, crime, public health issues. In addition, student may have the opportunity to travel to participate in district or city-wide drills and training events. Students will work with school officials and staff on projects to improve the safety of our schools and community. OSHA training and certification card will be provided, along with advanced CPR, Bleeding Control and more. Students are responsible for their own transportation or have a liability waiver to ride with another student on file with the instructor."},{id:"health-science-clinical",name:"Health Science Clinical",code:"TC769",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[11,12],credits:[2],prereq:"Principles of Health Science and Biology",summary:"This course is designed to provide for the development of multi-occupational knowledge and skills related to a wide variety of health careers. Students will have clinical hands-on experiences for continued knowledge and skill development. School district will provide transportation to the hospital for rotations. Students will provide medical insurance, scrubs to wear, name tag, and required immunizations to comply with hospital regulations. A criminal background check and drug test may be required. This course receives the same weight as an Honors course."},{id:"kinesiology",name:"Kinesiology",code:"TC031",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Principles of Health Science",fee:!0,summary:"Kinesiology I is designed to develop the understanding of human movement and how the body reacts to exercise. Students will learn in depth about muscular, skeletal and neural movements. Students will gain knowledge about common injuries, and treatment, health and wellness, sports nutrition, developing physical fitness, sports psychology, and careers in Kinesiology. Kinesiology I will provide hands-on activities for students to learn during specific units. Students will also receive their Basic Life Support (BLS) Certification. In addition, Kinesiology I will prepare the student who is interested in choosing a career in the Medical and Health Science Fields."},{id:"kinesiology-ii",name:"Kinesiology II",code:"TC033",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[12],credits:[1],prereq:"Principles of Health Science and Kinesiology I. Medical Terminology and Anatomy & Physiology recommended",flags:["Elective","New Course"],summary:"Kinesiology II is designed to dive deeper into the field and prepare students who are interested in achieving their Personal Trainer Certification. Students will learn in depth about the Psychology of Exercise, Modern State of Health and Fitness, Professional Development and Responsibility, Posture, Movement and Performance Assessments, Sports Nutrition, Exercise Metabolism and Bioenergetics, and Exercise Technique and Training Instruction such as Flexibility Training Concepts, Cardiorespiratory Training Concepts, Balance Training Concepts, Plyometric Training Concepts, Speed, Agility, and Quickness Training Concepts and Resistance Training Concepts. Students will have the opportunity to shadow Health Care Professionals such as Physical Therapists, Personal Trainers, and more. At the end of the year, students will sit for the Personal Trainer Board of Certification Examination."},{id:"medical-terminology",name:"Medical Terminology",code:"TC771A",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Articulated College Credit in 9th or 10th grade",summary:"Medical terminology, for the future doctor, nurse, or upper level medical technician, is designed to develop a working knowledge of the language of medicine. Students acquire word-building skills by learning prefixes, suffixes, roots, and abbreviations. By relating terms to body systems, students identify proper use of words in a medical environment. Knowledge of medical terminology enhances students' ability to successfully secure employment or pursue advanced education in health care."},{id:"practicum-in-health-science-pharmacy-technician",name:"Practicum in Health Science-Pharmacy Technician",code:"TC777",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[12],credits:[2],prereq:"Health Science Clinical or Theory of Health Science, and Biology",summary:"This is an occupationally-specific course designed to provide knowledge and skills for certification or licensure in an allied health career. Students develop advanced clinical skills necessary for employment in the health care industry or continued education in health careers. Students will be responsible for their transportation to off-site training and medical insurance. Scrubs, nametags, and immunizations may also be needed to comply with hospital and/or facility regulations. A criminal background check and drug test may be required. This course receives the same weight as an Honors course."},{id:"practicum-in-health-science-phlebotomy-technician",name:"Practicum in Health Science-Phlebotomy Technician",code:"TC783",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[12],credits:[2],prereq:"Theory of Health Science or Health Science Clinical, and Biology",summary:"This health science occupations course, which meets daily for two periods back-to-back, provides students with clinical experience and training to perform a variety of blood collection methods. Students will also learn the theory and principles behind other lab tests, such as urinalysis and hematocrit. This course receives the same weight as an Honors course."},{id:"principles-of-health-science",name:"Principles of Health Science",code:"TC770",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Satisfies Health Credit",alsoIn:["Health and PE"],summary:"Principles of Health Science is designed to develop healthcare specific knowledge and skills in effective communications, ethical and legal responsibilities, client care, safety, first aid, and CPR. Principles of Health Science prepares students for transition to clinical or work-based learning experiences in health care."},{id:"theory-of-health-science",name:"Theory of Health Science",code:"TC773",dept:"Technology & Career Education",group:"Health Science",level:"On-level",grades:[11,12],credits:[1],prereq:"Principles of Health Science and Biology",summary:"Knowledge of basic health science skills such as: prevention of disease, examination of legal and ethical behaviors, CPR, first aid and specific health care communication will be enhanced. This course will also advance skills related to certain health science professions including medical assisting, pharmacy, phlebotomy and EMT."},{id:"child-development",name:"Child Development",code:"TC710",dept:"Technology & Career Education",group:"Hospitality & Human Services",level:"On-level",grades:[10,11,12],credits:[1],prereq:"None",note:"Articulated College Credit when taken in 10th grade",flags:["Articulated College Credit"],summary:"This course introduces the students to the exciting world of Child Development. A variety of activities will develop a greater understanding of the physical, emotional, social and intellectual development of young children including those with special needs. Student 'Buddies' can expect to learn about the care and guidance of young children through weekly visits to a quality child care facility. Other topics include career options related to the care and education of children. Child Development not only offers quality experience, but is a fun hands-on way to explore the career fields of education and human services. The CPR, and First Aid certification may be earned during this course."},{id:"epicure-academy-culinary-arts",name:"Epicure Academy — Culinary Arts",code:"TC717",dept:"Technology & Career Education",group:"Hospitality & Human Services",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Lab Fee $50.00",fee:!0,flags:["Elective"],summary:"Instruction and learning activities are provided in a food lab using hands-on experiences where students learn numerous cooking techniques then create cuisines around the world. Students work in small groups when creating dishes and often challenge other groups to earn best dish recognition. This program provides students the opportunity to: Learn how to lead healthier lives through technique & nutrition; Work together in concert to prep, cook, eat, and clean the kitchen; Prepare and share food with others to build community, gain hospitality management and food production skills; Acquire career-oriented, entrepreneurship skills necessary in hospitality management, marketing, and operations; Blend physics and chemistry to transform tastes and textures of food; Molecular Gastronomy; Analyze what impact they can have on the world through their food consumption and food waste management; Learn how to apply professional standards of ethics, food safety, and employability skills."},{id:"food-preparation-and-nutrition",name:"Food Preparation and Nutrition",code:"TC716",dept:"Technology & Career Education",group:"Hospitality & Human Services",level:"On-level",grades:[9,10,11,12],credits:[.5],prereq:"None",note:"Lab Fee $25.00",fee:!0,summary:"Foods—a technical laboratory course concentrates on nutrition, food choices, and food management skills for individuals and the family throughout the life cycle. Instruction addresses nutrition for the perspective of food habits and wellness, menu planning, special dietary needs, food costs and budgeting, consumer food buying strategies, food safety and sanitation procedures, food labels, storage and preparation practices. Students can expect to be involved in food preparation individually and in groups, throughout the course. This advanced level also includes many demonstrations of food techniques."},{id:"ap-computer-science-a",name:"AP Computer Science A",code:"MA281",dept:"Technology & Career Education",group:"Information Technology",level:"AP",grades:[9,10,11,12],credits:[1],prereq:"Completion of Algebra 1, Honors recommended",summary:"AP Computer Science is designed for the serious student who wishes to be challenged. The student will use the Object Oriented programming language JAVA to write interactive programs for solving problems. Topics covered are data types, selection statements, looping, classes, arrays, lists, searching and sorting algorithms, inheritance and recursion. The student will be eligible to take the AP Computer Science A exam. Interested and qualified students may take Computer Science II Advanced the following year."},{id:"ap-computer-science-principles",name:"AP Computer Science Principles",code:"TC736",dept:"Technology & Career Education",group:"Information Technology",level:"AP",grades:[9,10,11,12],credits:[1],prereq:"Completion of Geometry",summary:"AP Computer Science Principles is a course which focuses on the power, beauty, and joy of computing and shows how computing impacts almost every aspect of our lives. Students will learn problem-solving and reasoning skills that are the foundation of computer science. This course will utilize project-based learning to discover how computational thinking and creativity can help solve real-world problems in varied fields such as social networking, Big Data, artificial intelligence, and security. The major areas of study in the AP Computer Science Principles course are organized around seven big ideas: creativity, abstraction, data and information, algorithms, programming, the Internet, and global impact. Students will also develop some basic programming skills. Interested students are eligible to take the AP Computer Science Principles exam which includes the Create Task component."},{id:"ap-cybersecurity",name:"AP Cybersecurity",code:"TC281",dept:"Technology & Career Education",group:"Information Technology",level:"AP",grades:[10,11,12],credits:[1],prereq:null,flags:["New Course"],summary:"In this hands-on, scenario-driven course, students explore the world of cybersecurity—learning how to protect data, defend systems, and investigate real-world digital threats. Topics include risk assessment, cryptography, social engineering, digital forensics, and ethical hacking. Students will also study legal and ethical considerations, explore career pathways in cybersecurity, and practice defending systems in simulated environments."},{id:"computer-science-ii",name:"Computer Science II",code:"TC285",dept:"Technology & Career Education",group:"Information Technology",level:"On-level",grades:[10,11,12],credits:[1],prereq:"AP Computer Science A",summary:"This course is designed for the student who has displayed exceptional programming talent in AP Computer Science I and is interested in taking the AP Computer Science exam. The major emphasis will be on large GUI projects using data structures, such as linked lists, stacks, queues, hash tables, and binary trees. An introduction to robotics programming; iPhone and Android development; and graphical games is included. The course is designed for students interested in careers in computer programming, engineering, mathematics, or science related fields. JAVA, C, and Swift are the main programming languages that are used. This course receives the same weight as an AP course."},{id:"computer-science-iii",name:"Computer Science III",code:"TC737",dept:"Technology & Career Education",group:"Information Technology",level:"On-level",grades:[11,12],credits:[1],prereq:"Computer Science II ADV",summary:"This course is designed for the student who has displayed exceptional programming talent in Computer Science II ADV. Students work mainly on large projects which may include graphical games; communication programs; robotics programming; database development in SQL; and internet web applications The course is designed for students interested in careers in computer programming, engineering, mathematics, or science related fields. JAVA, C, Swift, and PHP are the main programming languages. An introduction to iPhone and Android development is included. This course receives the same weight as an AP course."},{id:"computer-science-independent-study",name:"Computer Science Independent Study",code:"TC738",dept:"Technology & Career Education",group:"Information Technology",level:"On-level",grades:[12],credits:[1],prereq:"Computer Science 3",summary:"This course is designed for the student who has displayed exceptional programming talent in Computer Science II ADV and has taken Computer Science 3. Students work mainly on large projects which may include graphical games, communication programs, database development in SQL, and internet web applications. The course is designed for students interested in careers in computer programming, engineering, mathematics, or science-related fields. JAVA, C, Swift, and PHP are the main programming languages used. An introduction to iPhone and Android development is included. This course receives the same weight as an AP course."},{id:"swift-coding",name:"Swift Coding",code:"TC280",dept:"Technology & Career Education",group:"Information Technology",level:"Honors",grades:[9,10,11,12],credits:[1],prereq:null,summary:""},{id:"3d-cad-engineering-design-and-presentation",name:"3D CAD Engineering Design and Presentation",code:"TC350",dept:"Technology & Career Education",group:"STEM & Engineering",level:"On-level",grades:[10,11,12],credits:[1],prereq:"None",summary:`Students enrolled in this class will learn and demonstrate the process of engineering design. Emphasis will be placed on documentation of ideas and designs developed. Documentation will range from hand sketched drawings, In multi-view and pictorial formats, to detailed, dimensioned drawings created with Solidworks, an industry standard Computer-Aided-Design (CAD) system. Upon completion of the course, the student should be prepared to take the Certified Solid Works Associate (CSWA) Exam. Upon preparation, students will be provided with a paid exam for the CSWA.

Project Management will be emphasized in this course. Each student will have the opportunity to contribute as a team member and team leader. Students will be expected to develop a project schedule and then complete tasks according to the schedule. Progress will be documented in an Engineering Notebook so that early ideas and corrected or discarded implementations can be reviewed. Projects will include construction of prototypes and models.`},{id:"invention-and-innovation-first-focus-principles-of-applied-engineering-and-tech",name:"Invention and Innovation: First Focus Principles of Applied Engineering and Tech",code:"TC354C",dept:"Technology & Career Education",group:"STEM & Engineering",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",note:"Tournament/materials/kit/registration fees",fee:!0,summary:"Invention and Innovation— FIRST/VRC Focus is an extracurricular robotics class with the expectation that students enrolling in this class will participate on a FIRST Robotics contest teams (FRC and FTC) or Vertical Robotics Challenge contest team. These teams meet outside the school day in preparation for competition. Students will develop critical thinking and problem-solving skills as well as introduce concepts of engineering and technology with emphasis placed on the FIRST Robotics Contests or Vertical Robotics Challenge contest. It will provide students with opportunities to research, design, develop, build, test and evaluate solutions to real life problems focused around the contest. It will consist of direct instruction, hands-on learning and after school work sessions. Software and hardware exposure will include access/exposure to SolidWorks, Java, drones, Spheros, LabVIEW, Python, 3D printing, Laser Cutting/Engraving and basic machine shop skills. Basic building principles and computer programming will be included. Those students choosing to participate in FIRST Technical Challenge will go through a tryout/selection process in late Spring/early summer 2021. Students enrolled in this class not participating in FTC, will participate on the Junior Varsity FRC team(FRC 2689 Team Apprentice) or Vertical Robotics Challenge team. Students are expected to attend tournaments related to their contest team and attend afterschool/evening/weekend work sessions."},{id:"principles-of-applied-engineering-and-tech",name:"Principles of Applied Engineering and Tech",code:"TC354",dept:"Technology & Career Education",group:"STEM & Engineering",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"Principles of Applied Engineering will help students develop critical thinking and problem-solving skills as well as introduce principles of engineering and technology. It will provide students with opportunities to research, design, develop, build, test and evaluate solutions to real-life problems. It will consist of direct instruction and hands-on learning with software programs: Computer Assisted 3D Design (Solid Works), LEGO EV3, Inkscape, 3D Printing with Slicer softwares, Glowforge and Thunder Laser Engraving/Cutting. This course will teach basic engineering principles with various robotics kits, design and production activities."},{id:"robotics-engineering-first-focus",name:"Robotics Engineering — First Focus",code:"TC355",dept:"Technology & Career Education",group:"STEM & Engineering",level:"On-level",grades:[10],credits:[1],prereq:"Invention & Innovation FIRST Focus OR Principles of Applied Engineering",note:"Tournament/materials/kit/registration fees",fee:!0,summary:"This class, which requires extracurricular participation, is focused on the FIRST Robotics Contest or Vertical Robotical Challenge program contest teams. This course supports students in gaining the fundamental understanding of systems that make up robots and drones as well as workplace competency development. This class will build on skills and knowledge from the previous year's competition/classes. Students will continue to work on 3D CAD knowledge (SolidWorks) and skills with the potential to take the CSWA and Additive Manufacturing certification at the end of the year. Through implementation of the design process, students will transfer advanced academic skills to component designs in a project-based environment. Students will build prototypes or use simulation software to test their designs. Additionally, students will explore career opportunities, employer expectations, and educational needs in the robotics and automation industry. Those students choosing to participate in FIRST Technical Challenge (FTC) will go through a tryout/selection process in late Spring/early summer 2021. Students enrolled in this class not participating in FTC, will participate on the Junior Varsity FRC team or Vertical Robotics Challenge team. Students are expected to attend as related to their contest program and participate in afterschool, evening and weekend work sessions."},{id:"robotics-ii",name:"Robotics II",code:"TC357",dept:"Technology & Career Education",group:"STEM & Engineering",level:"On-level",grades:[11,12],credits:[1],prereq:"Robotics Engineering, FTC Participation or Instructor approval",fee:!0,summary:`Participation Fee

This class, which requires extracurricular participation in either FIRST Robotics Contest or Vertical Robotics Contest, is focused on the FIRST Robotics Contest/Vertical Robotics contest program and contest teams. This course will consist of instruction and hands-on learning in areas of study related to the Robotics contest, not limited to but including: shop tools, engineering design, mechanical systems, pneumatic controls, electronics (DC), Computer Aided Design (Solidworks), Programming (C, LABView) and systems integration. Coursework in these areas will be focused around the extracurricular FIRST Robotics Competition and Vertical Robotics Contest. Students are required to participate fully in all aspects of this competition, which may include fundraising, community presentations, mentoring of other teams and students, graphic and animation production, and website maintenance. Vertical Robotics Contest is a Fall semester focused contest with weekly meetings starting in September and going through mid November. FRC students will be required to be full participants in designated work sessions and team meetings twice a week after school during Fall semester weekly meetings and on 4 weekdays and Saturdays during January-March. Students are expected to attend as related to their contest program and participate in afterschool, evening and weekend work sessions. This course receives the same weight as an Honors course.`},{id:"athletic-training-sports-medicine",name:"Athletic Training - Sports Medicine",dept:"Health and PE",group:"Athletics",level:"On-level",grades:[9,10,11,12],credits:[.5,1],prereq:"Trainer Approval",note:"*For the student that has never taken a PE or athletics course.",fee:!0,summary:`Sports medicine plays an integral role in athletics at Westlake. The sports medicine department includes orthopedists, athletic trainers, physical therapists, as well as many other health specialists. In this course athletic trainers work to evaluate, organize treatment, plan rehabilitation, and prevent athletic injuries. This course is designed for students interested in becoming a student athletic trainer for our Westlake High School athletic teams. This course will introduce the student to the day to day routine performed in the Athletic Training Room, as well as basic skills. Such skills will include injury care, game preparation, taping and bracing, as well as time management and leadership. An application will be required, as well as possible letters of recommendation. Enrollment is by athletic trainer approval only.
