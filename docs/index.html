orth and support community engagement."},{id:"pe-yoga",name:"PE Yoga",code:"PE801",dept:"Health and PE",group:"Health & PE",level:"On-level",grades:[9,10,11,12],credits:[.5,1],prereq:"None",note:"Students will need to provide their own yoga mat for this class.",summary:"This Lifetime Fitness and Wellness Pursuits course offers current approaches for the foundation of personal fitness, physical literacy, lifetime wellness, and healthy living through Yoga. Students in Lifetime Fitness and Wellness Pursuits will apply the knowledge and skills to demonstrate mastery of the concepts needed to achieve lifetime wellness. Students will participate in Yoga to attain personal fitness and lifetime wellness."},{id:"pe-personal-fitness-and-team-sports",name:"PE: Personal Fitness and Team Sports",code:"PE803A",dept:"Health and PE",group:"Health & PE",level:"On-level",grades:[9,10,11,12],credits:[.5,1],prereq:"None",summary:"This skill-based lifetime activities course offers students the opportunity to demonstrate mastery in basic sport skills, basic sport knowledge, and health and fitness principles. Students experience opportunities that promote physical literacy and lifetime wellness."},{id:"excused-period",name:"Excused Period",dept:"Miscellaneous Electives",level:"On-level",grades:[11,12],credits:[0],prereq:"Principal, Counselor, Written Parent Approval",flags:["Elective"],summary:`Excused periods relate to those 11th and 12th grade students who have enough credits to fulfill transcript requirements and are not 'at risk' to graduate. Excused periods may be substituted at the beginning or end of the scheduled day to allow flexibility for the student to attend all classes for dual credit or to work. The following points relate to excused periods:

If a student qualifies for excused periods and approval is granted, the student can apply the excused periods either at the beginning or end of the scheduled day. In deciding whether to choose an excused period, the student must keep in mind he/she must be enrolled in at least 6 credit courses during a semester in 11th grade and 5 credit courses in 12th grade. All students must have a lunch period.`},{id:"methodology-for-academic-and-personal-success-i",name:"Methodology for Academic and Personal Success I",code:"EL113",dept:"Miscellaneous Electives",level:"On-level",grades:[9,10],credits:[.5,1],prereq:"None",summary:"This course focuses on the skills and strategies necessary for students to make a successful transition into high school academics. Students will explore options available in high school, post-secondary education, and post-secondary employment. Essential knowledge and skills include: learning and communication skills; self-discipline, attitude, and resilience; time management, organization and study skills; leadership and character; academic and career exploration."},{id:"office-aide",name:"Office Aide",code:"BE672",dept:"Miscellaneous Electives",level:"On-level",grades:[11,12],credits:[0],prereq:"None",flags:["Elective"],summary:"This course is designed as an independent studies class and is open to juniors and seniors who have enough credits to fulfill transcript requirements and are not 'at risk' to graduate. Seniors will be given priority enrollment. Students are expected to be able to fulfill duties and responsibilities common to school-related offices; to have skills for effective communication and information management in an office environment; and to understand the ethical ramifications related to privacy, reliability and punctuality in office environments. Daily attendance is required. Grade will be pass/fail."},{id:"peer-partners",name:"Peer Partners",dept:"Miscellaneous Electives",level:"On-level",grades:[9,10,11,12],credits:[.5,1],prereq:"Application and approval",summary:`PEER PARTNERS 1 - EL993 A/B (PASWD1)

Peer Partners for Students with Disabilities is designed to promote an inclusive educational environment for all students. This course provides peer partners the opportunity to develop leadership and communication skills. Peer partners obtain initial training in confidentiality, cueing, prompting, and positive reinforcement upon enrollment in the general education classroom and special education setting by modeling appropriate learning behaviors, assisting with hands-on learning activities, and developing activities to facilitate inclusion in the classroom. The goal is to create a relationship among age appropriate peers of differing abilities, both socially and academically.`},{id:"adaptive-physical-education",name:"Adaptive Physical Education",dept:"Special Education",group:"Alternate",level:"Modified",grades:[9,10,11,12],credits:[1],prereq:"ARD Placement",summary:`ADAPTIVE PHYSICAL EDUCATION (not adapted)

SE932-Level 1

SE820-Level 2

Adapted Physical Education involves adapting, modifying, and changing a physical activity so it is appropriate for a person who has a disability. Specially designed motor activities are presented which engage students in the development of fundamental motor skills, leading to the acquisition of physical fitness. Each child participates to the maximum extent possible in dance, body management, group games, and sports.`},{id:"algebra-alternate",name:"Algebra Alternate",code:"SE927",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[9],credits:[1],prereq:"ARD Placement",summary:"This course emphasizes basic knowledge and understanding of mathematical operations, symbols, problem-solving, and estimation skills."},{id:"algebra-ii-alternate",name:"Algebra II Alternate",code:"SE241",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[11],credits:[1],prereq:"ARD Placement",summary:"This course emphasizes generalization skills of mathematical operations, symbols, problem-solving, and estimation skills."},{id:"biology-alternate",name:"Biology Alternate",code:"SE313",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[9],credits:[1],prereq:"ARD Placement",summary:"This course emphasizes the application of scientific concepts related to ecology, classification, body systems, health of organisms, cause and effect, and environmental study."},{id:"economics-alternate",name:"Economics Alternate",code:"SE438",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[12],credits:[.5],prereq:"ARD Placement",summary:"This course emphasizes problem-solving and ability to draw conclusions through the application of skills related to general money management, purchasing goods and services, and use of economic resources."},{id:"english-i-alternate",name:"English I Alternate",code:"SE141",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[9],credits:[1],prereq:"ARD Placement",summary:`This course emphasizes sight word vocabulary development through word strategies, writing in a variety of forms, and comprehension of basic information.

",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[10],credits:[1],prereq:"ARD Placement",summary:"This course provides the student with an operational understanding of pre-concepts basic to physical science, including a general introduction to chemistry and physics."},{id:"path-to-college-and-career-alt",name:"PATH to College and Career ALT",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[9,10,11,12],credits:[1],prereq:null,summary:""},{id:"personal-health-hygiene-alternate",name:"Personal Health/Hygiene Alternate",code:"SE990",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[9,10,11,12],credits:[.5],prereq:"ARD Placement",summary:"Students enrolled in Personal Health/Hygiene will be exposed to individual health and hygiene, as they affect wellness, disease prevention, interpersonal skill enhancement, human growth and development, emergency and first aid, diet, and exercise, as each relates to a healthy lifestyle."},{id:"reading-improvement-alternate",name:"Reading Improvement Alternate",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[9,10,11,12],credits:[],prereq:null,summary:""},{id:"us-history-alternate",name:"US History Alternate",code:"SE453",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[11],credits:[1],prereq:"ARD Placement",summary:"This course emphasizes generalization skills related to functional community activities, current events and environmental issues."},{id:"world-geography-alternate",name:"World Geography Alternate",code:"SE451",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[9],credits:[1],prereq:"ARD Placement",summary:"This course emphasizes basic knowledge and understanding of functional community activities, current events and environmental issues."},{id:"world-history-alternate",name:"World History Alternate",code:"SE452",dept:"Special Education",group:"Alternate",level:"Alternate",grades:[10],credits:[1],prereq:"ARD Placement",summary:"This course emphasizes application of functional community activities, current events and environmental issues."},{id:"algebra-i-modified",name:"Algebra I Modified",code:"SE225",dept:"Special Education",group:"Modified",level:"Modified",grades:[9,10,11,12],credits:[1],prereq:"ARD Placement",summary:"This course covers essential elements of Algebra, including integer operations, simplifying expressions, exponents, math properties, order of operations, linear equations, applications of Algebra, exponents and polynomials, factoring, statistics and probability, fractions, systems of linear equations, and introduces geometry, and quadratic equations."},{id:"biology-modified",name:"Biology Modified",code:"SE310",dept:"Special Education",group:"Modified",level:"Modified",grades:[9,10,11],credits:[1],prereq:"ARD Placement",summary:"This course is designed to present biological education by structuring its content around the basic themes within biology. First semester topics include: ecology, cell biology, genetics and evolution. Second semester topics include: classification and physiology of organisms. All are explored through class and laboratory work."},{id:"career-preparation",name:"Career Preparation",dept:"Special Education",group:"Modified",level:"Modified",grades:[11,12],credits:[2,3],prereq:"ARD Placement",summary:"The focus of Career Pathways is to expose students to various career choices and community-based work environments. Instruction and skill development are provided in areas of self-appraisal (strengths, preferences, interests, and needs), goal setting, problem solving, communication, disability awareness, time management, work-based social behaviors, and money management. All students in the career preparation courses will be on a career path that will allow students to participate in job exploration during class, within the school, and in the community. Once a student is better prepared to investigate career opportunities, they will begin building a resume to determine future volunteer or paid opportunities."},{id:"chemistry-modified",name:"Chemistry Modified",code:"SE322",dept:"Special Education",group:"Modified",level:"Modified",grades:[10,11,12],credits:[],prereq:null,summary:""},{id:"economics-modified",name:"Economics Modified",code:"SE435",dept:"Special Education",group:"Modified",level:"Modified",grades:[12],credits:[1],prereq:"ARD Placement",summary:"This course is designed to provide a basic understanding of America's economic system. This course includes the study of the fundamental concepts of free enterprise, profit motive, competition, fiscal policies, and role of government. Current economic topics, problems, and potential solutions will also be included."},{id:"english-i-modified",name:"English I Modified",code:"SE106",dept:"Special Education",group:"Modified",level:"Modified",grades:[9],credits:[1],prereq:"ARD Placement",summary:'This is a Special Education course strictly for students "ARDed" into the class through an IEP meeting. Units include Novels (Romeo & Juliet / The Odyssey), Memoir writing, Short stories, and Poetry. We also hone our skills by reviewing grammar usage, literary analysis and independent reading..'},{id:"english-ii-modified",name:"English II Modified",code:"SE114",dept:"Special Education",group:"Modified",level:"Modified",grades:[10],credits:[1],prereq:"ARD Placement",summary:'This is a Special Education course strictly for students "ARDed" into the class through an IEP meeting. Units include Novels (Romeo & Juliet / The Odyssey), Memoir writing, Short stories, and Poetry. We also hone our skills by reviewing grammar usage, literary analysis and independent reading.'},{id:"english-iii-modified",name:"English III Modified",code:"SE122",dept:"Special Education",group:"Modified",level:"Modified",grades:[11],credits:[1],prereq:"ARD Placement",summary:"This course incorporates a chronological approach to the study of American Literature with emphasis on reading comprehension; literary analysis; vocabulary and spelling improvement; and composition and research skills. Formal and informal writing assignments are designed to improve paragraph development, language usage, and essay writing."},{id:"english-iv-modified",name:"English IV Modified",code:"SE132",dept:"Special Education",group:"Modified",level:"Modified",grades:[12],credits:[1],prereq:"ARD Placement",summary:"This course combines the study of composition and literature. The composition component targets the development of the student's writing style with particular emphasis on improving grammatical structures while practicing various modes of writing, both formal and informal. The literature component focuses on enhancing the student's appreciation for literature through literacy analysis, vocabulary development and in-creasing comprehension."},{id:"food-science-modified",name:"Food Science Modified",code:"SE315",dept:"Special Education",group:"Modified",level:"Modified",grades:[9,10,11,12],credits:[1],prereq:"ARD Placement",summary:`This course is designed to fulfill a science credit. We will study the digestive system, chemical makeup of all 7 food groups, calories and energy, and chemical reactions as they relate to food.

Second semester we will become familiar with the food science industry, careers in this field, the history of food science and early pioneers in the field. Several times a month we will be working with food and studying preservation and safe practices in food preparation.`},{id:"geometry-modified",name:"Geometry Modified",code:"SE227",dept:"Special Education",group:"Modified",level:"Modified",grades:[10,11,12],credits:[1],prereq:"ARD Placement",summary:"This course includes the essentials of plane, solid, and basic coordinate geometry with an emphasis on problem-solving and real-life application of geometric concepts. Units of study include angle measurements and relationships, triangles and congruence, parallel lines, quadrilaterals, similarity and scale change, polygons and area, circles, space figures and surface area, and trigonometric ratios."},{id:"health-education-modified",name:"Health Education Modified",code:"SE823",dept:"Special Education",group:"Modified",level:"Modified",grades:[9,10,11,12],credits:[.5],prereq:"ARD Placement",summary:"This course provides opportunities for students to acquire facts, develop proper attitudes, and establish practices and habits that will contribute to personal, family, and community health. Topics include wellness, mental health, nutrition, first aid, consumer education, environmental health, diseases, substance abuse, tobacco use, AIDS, sexually transmitted diseases and human sexuality. This course will follow the student's Individual Education Plan goals and objectives."},{id:"integrated-physics-and-chemistry-modified",name:"Integrated Physics and Chemistry Modified",code:"SE300",dept:"Special Education",group:"Modified",level:"Modified",grades:[10,11],credits:[1],prereq:"ARD Placement",summary:"This course provides the student with an operational understanding of concepts basic to physical science, including a general introduction to chemistry and physics."},{id:"path-to-college-and-career",name:"PATH to College and Career",dept:"Special Education",group:"Modified",level:"Modified",grades:[9,10,11,12],credits:[.5,1],prereq:"ARD Placement",summary:`PATH Modified SE455

PATH Modified with Behavior Support SE457

PATH 2 Mod SE465

PATH 2 Mod with Behavior Support SE467

PATH 3 Mod SE475

PATH 3 Mod with Behavior Support SE477

PATH 4 Mod SE485

PATH 4 Mod with Behavior Support SE487

The PATH courses focus on developing the habits and skills that are expected in college study and the workforce. Through performances that apply both contextual and non-contextual knowledge, students will demonstrate the mastery of the following skills: collaboration, critical thinking, problem-solving, effective oral and written communication, time/project management, and self-determination.`},{id:"personal-finance-i",name:"Personal Finance I",code:"SE201",dept:"Special Education",group:"Modified",level:"Modified",grades:[10,11,12],credits:[1],prereq:"ARD Placement",summary:"This course will provide students with math skills needed in everyday living. Topics will include earnings (wages, commissions, fringe benefits), taxes (income, Social Security, sales), budgeting (checking accounts, housing, transportation), personal investments, and consumer credit (loans, credit cards)."},{id:"reading-improvement",name:"Reading Improvement",code:"SE120",dept:"Special Education",group:"Modified",level:"Modified",grades:[9,10,11,12],credits:[.5],prereq:"ARD Placement",summary:"This course is designed for high school students who are reading 1 - 3 years below grade level and who need specially designed instruction in reading methodology and specific goals related to reading acquisition. This curriculum is designed for a small class environment. The multisensory lessons are designed to teach reading and listening comprehension strategies (including activating/applying background knowledge visualizing, questioning, making inferences, close reading, note-taking), English test-taking strategies, vocabulary acquisition, and reading fluency. Prerequisites: IEP, ARD Committee recommendation."},{id:"us-government-modified",name:"US Government Modified",code:"SE425",dept:"Special Education",group:"Modified",level:"Modified",grades:[12],credits:[.5],prereq:"ARD Placement",summary:"This course surveys the American political system beginning with the events leading to the adoption of the Constitution. The major units include constitutional principles, political parties and political participation, the legislative branch, executive branch, and judicial branch. Current events are discussed in order to apply newly-learned concepts, as well as to better understand contemporary issues."},{id:"us-history-modified",name:"US History Modified",code:"SE408",dept:"Special Education",group:"Modified",level:"Modified",grades:[11],credits:[1],prereq:"ARD Placement",summary:"This course will be a survey of the events from post Civil War Reconstruction to the present. It will include an overview of the Civil War, American Industrial Revolution, westward expansion, progressive reform, events leading to World War I, the depression of the 30's, World War II, the Civil Rights movement, and the social, political, economic, and technological advances of the 50's through the 90's."},{id:"world-geography-modified",name:"World Geography Modified",code:"SE401",dept:"Special Education",group:"Modified",level:"Modified",grades:[9],credits:[1],prereq:"ARD Placement",summary:"World Geography is a broad-based survey course designed to acquaint students with the world physically, politically, culturally and economically. The course is hands-on and activity-oriented."},{id:"world-history-modified",name:"World History Modified",code:"SE406",dept:"Special Education",group:"Modified",level:"Modified",grades:[10],credits:[1],prereq:"ARD Placement",summary:"World History is a study of man's development from pre-history to the twentieth century. Each unit includes general characteristics of a time period, an analysis of one or two sample cultures and a study of associated geographic features. World problems, such as food production, transportation, developing nations and environmental issues are examined. Current events are strongly emphasized."}],ls=Object.fromEntries(zc.map(o=>[o.id,o])),Hc=[{id:"westlake",name:"Westlake High School",short:"Westlake",district:"Eanes ISD",city:"Austin, TX
