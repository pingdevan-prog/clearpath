the same weight as an AP course.'},{id:"chinese-i",name:"Chinese I",code:"FL646",dept:"World Languages",group:"Chinese",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"Chinese I is a basic language course in which the students learn the Chinese sound system called Pinyin, the mechanics of stroke order, radicals in writing characters, class room expressions, and everyday life expressions. In addition, students will learn vocabulary and grammar to make phrases and sentences. They will learn to appreciate the rich Chinese culture, history, and tradition. A variety of language tasks will be re-quired for students to develop their ability to read, write, listen, and speak in the Chinese language."},{id:"chinese-ii",name:"Chinese II",code:"FL647",dept:"World Languages",group:"Chinese",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"Credit for Chinese I",summary:"Chinese II is a basic language course, building on Level I skills, with the expectation that students will master more in terms of degree and quantity. There will be further focus on the mechanics of stroke order, Pinyin, and radicals in learning Chinese characters. The students will continue to build vocabulary and learn grammar to help them express themselves with more confidence in reading, writing, listening, and speaking Chinese. In addition, they will learn how to form more complex sentences, to write practical Chinese letters, and special topic essays. The study of Chinese culture, history, and tradition will be continued to enhance the language skills."},{id:"chinese-iii-honors",name:"Chinese III Honors",code:"FL648",dept:"World Languages",group:"Chinese",level:"Honors",grades:[11,12],credits:[1],prereq:"Credit for Chinese II",summary:"Chinese Level III Honors is considered an intermediate Chinese language course. At this level, students are familiar with the process of learning vocabulary, character components, grammatical structure, and sentence structure. The level III Chinese course continues to develop the student's ability in listening, speaking, reading and writing. Students will learn how to write more complex Chinese sentences and essays. The AP and SAT II Chinese test formats will be introduced, and review materials will be provided for students. Students will learn to use computers and office software tools with Chinese language. Students will be exposed to various culture and social topics including the history and current Chinese events and they will exchange their opinions in classroom discussions."},{id:"ap-french-language-and-culture-level-iv",name:"AP French Language and Culture (Level IV)",code:"FL606",dept:"World Languages",group:"French",level:"AP",grades:[11,12],credits:[1],prereq:"French III Pre-AP",summary:"AP French focuses on concentrated practice of the four language skills, with an emphasis on the most advanced writing and speaking skills, as well as highly specialized vocabulary acquisition. French and Francophone cultural themes area also explored in depth throughout the year through a variety of authentic online resources, reading narratives, discussions, and year-long cultural comparison research projects. A strong foundation of basic and more advanced vocabulary and grammatical structures prior to enrollment is vital, as it will serve as the basis for all new learning. French is exclusively the language of the classroom. The only use of English is by the teacher to clarify concepts or to make important announcements when a misunderstanding would be harmful to the students. Students must be willing to speak only French in the classroom. Class participation, work completion, and spending some time reviewing concepts, reading, watching French news, or using other authentic online resources each day are essential for the development of oral and written proficiency and preparedness for the AP French Language and Culture Exam in May."},{id:"french-5-6-advanced",name:"French 5/6 Advanced",code:"FL607",dept:"World Languages",group:"French",level:"Post AP",grades:[11,12],credits:[1],prereq:"French IV-AP",flags:["Post AP"],summary:"French V/VI is a post-AP course which focuses on selected cultural topics (civilization, film, and literature) and the perfection of the four language skills, with an emphasis on the most advanced speaking skills and highly specialized vocabulary acquisition. Students will conduct self-directed and collaborative research activities and projects in areas of their choice on French and Francophone cultural themes throughout the year using a variety of authentic resources. A strong foundation of basic and more advanced vocabulary and grammatical structures prior to enrollment is vital, as it will serve as the basis for all new learning. French is exclusively the language of the classroom. The only use of English is by the teacher to clarify concepts or to make important announcements when a misunderstanding would be harmful to the students. Students must be willing to speak only French in the classroom. Class participation, work completion, and spending some time reviewing concepts, reading, watching French news, or using other authentic online resources each day are essential for the development of advanced oral, written, and cultural proficiency. These courses receive the same weight as an AP course."},{id:"french-i",name:"French I",code:"FL600",dept:"World Languages",group:"French",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"This is a technology-based course for students who want to learn the basic structure of the French language through the development of the four skills: reading, writing, listening, and speaking. Vocabulary and grammar are presented through communicative activities, and French and Francophone cultural themes are explored throughout the year through the use of authentic resources online, reading narratives, and cultural comparison activities. Students must be willing to speak French in the classroom as new vocabulary is gradually acquired. Class participation, work completion, and spending some time reviewing concepts each day are essential for the development of oral and written proficiency."},{id:"french-ii",name:"French II",code:"FL601",dept:"World Languages",group:"French",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"French I",summary:"This technology-based course is a continuation of French I where vocabulary and grammar are expanded. All four language skills are further developed, and French and Francophone cultural themes are explored in depth throughout the year through the use of a variety of written and oral activities, authentic online resources, reading narratives, and cultural comparison activities. Students must be willing to speak French in the classroom. Class participation, work completion, and spending some time reviewing concepts each day are essential for the development of oral and written proficiency."},{id:"french-iii-honors",name:"French III Honors",code:"FL604",dept:"World Languages",group:"French",level:"Honors",grades:[11,12],credits:[1],prereq:"French II",summary:"French III Honors focuses on concentrated practice and further development of the four language skills, with an emphasis on more advanced writing and speaking skills. French and Francophone cultural themes area also explored in depth throughout the year through a variety of authentic online resources, reading narratives, and cultural comparison research activities and projects. While previously learned grammar is reviewed, a strong foundation of vocabulary and grammar prior to enrollment is vital, as it will serve as the basis for all new learning. French is exclusively the language of the classroom. The only use of English is by the teacher to clarify concepts or to make important announcements when a misunderstanding would be harmful to the students. Students must be willing to speak French in the classroom. Class participation, work completion, and spending some time reviewing concepts each day are essential for the development of oral and written proficiency and preparedness for AP French."},{id:"ap-latin-level-iv",name:"AP Latin (Level IV)",code:"FL625",dept:"World Languages",group:"Latin",level:"AP",grades:[11,12],credits:[1],prereq:"Latin III Honors",summary:"Advanced Placement Latin is the culmination of previous studies of Latin. This fast-paced class focuses on reading and comprehending samples of Latin prose from Pliny's Epistulae and poetry from Vergil's Aeneid. To prepare for the AP Latin exam, students develop and hone their abilities to analyze and interpret texts, and learn to make and defend arguments based on Latin texts. Topics include grammar, history, culture, mythology, and literary conventions. Participation with Latin Club and JCL augment these studies and provide students with unique opportunities to compete, to network with other students, teachers, professors, and authors, and to potentially win awards and college scholarships."},{id:"latin-i",name:"Latin I",code:"FL620",dept:"World Languages",group:"Latin",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"Latin I is an introduction to Classical Latin and the Roman world (circa 200 BC to 200 AD). Students will learn vocabulary, pronunciations, and the grammar and syntax necessary to read Latin, compose basic text in Latin, and to use the language as a medium for understanding the civilization of Classical Antiquity. Additional units on Roman life, culture, history and mythology complete the curriculum. Participation with Latin Club and JCL augment these studies and provide students with unique opportunities to compete, to network with other students, teachers, professors, and authors, and to potentially win awards and college scholarships."},{id:"latin-ii",name:"Latin II",code:"FL621",dept:"World Languages",group:"Latin",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"Latin I",summary:"This course begins with a comprehensive review of Latin I and then expands upon those foundations to prepare students for Latin III Honors. Emphasis will be placed upon grammar and reading with a continuous goal of proficiency and overall language mastery. The focus will spotlight Rome and its territories, in terms of history, politics and government, mythology, daily life and other topics. Students will be able to pronounce Latin, read Latin passages, compose simple Latin sentences, build their English vocabulary, and compare the ancient world with the modern. Participation with Latin Club and JCL augment these studies and provide students with unique opportunities to compete, to network with other students, teachers, professors, and authors, and to potentially win awards and college scholarships."},{id:"latin-iii-honors",name:"Latin III Honors",code:"FL624",dept:"World Languages",group:"Latin",level:"Honors",grades:[10,11,12],credits:[1],prereq:"Latin II",summary:"After a thorough review of grammar, syntax, vocabulary, and reading skills, Latin III students will read and analyze authentic Latin texts to see what real Latin looks like. Authors studied may include Martial, Horace, Ovid, Catullus, Caesar, and Vergil. Topics include grammar, history, culture, mythology, and literary conventions. The AP test formats and material will be introduced at this level to help prepare students for AP Latin IV. This course is intended to prepare students for Latin IV, to expand upon & deepen knowledge and skills acquired in Latin II, and to help nourish students' interest in the classics. Participation with Latin Club and JCL augment these studies and provide students with unique opportunities to compete, to network with other students, teachers, professors, and authors, and to potentially win awards and college scholarships."},{id:"latin-v-advanced",name:"Latin V Advanced",code:"FL626",dept:"World Languages",group:"Latin",level:"On-level",grades:[12],credits:[1],prereq:"AP Latin",summary:"Latin V focuses on the same principal objectives as AP Latin, with students reading from authentic Latin prose and poetry authors. The material in this Post-AP course can be more challenging than that found in AP Latin, but the pace is more relaxed and students will have a voice in selecting who/what we study. Topics may include the natural world, food & cooking, mythology, history, politics, philosophy, poetry, and autobiography from selected works of the primary sources- real Latin. Authors may include Eutropius, Cato, Cornelius Nepos, Livy, Cicero, Ovid, Horace, Catullus, Augustus, Phaedrus, and Pliny the Younger. Students who wish to take the SAT II subject test in Latin may use the content of this class in their preparation for potential credit/placement through the exam. Participation with Latin Club and JCL augment these studies and provide students with unique opportunities to compete, to network with other students, teachers, professors, and authors, and to potentially win awards and college scholarships. This course receives the same weight as an AP course."},{id:"latin-vi-advanced",name:"Latin VI Advanced",code:"FL627",dept:"World Languages",group:"Latin",level:"On-level",grades:[12],credits:[1],prereq:"Latin V ADV",summary:"This post-AP independent study course is designed for students who have taken 5 years of Latin and wish to continue studying Latin in high school. The teacher and student will determine topics of interest to translate and research, and the student's progress will be evaluated through classwork, quizzes, tests, presentations, and discussions with the teacher. The student can expect to work and problem-solve alone most of the time with the teacher serving as supervisor and mentor. This course receives the same weight as an AP course."},{id:"ap-spanish-iv",name:"AP Spanish IV",code:"FL638",dept:"World Languages",group:"Spanish",level:"AP",grades:[11,12],credits:[1],prereq:"Spanish III Honors",summary:"This course is designed for students who wish to further improve their speaking and listening abilities, strengthen their reading and composition skills and broaden their knowledge of Hispanic literature and culture. In order to further strengthen speaking and listening proficiency, Spanish is the exclusive language of all classroom activities. To improve written expression, the students study and practice the elements of essay writing. To achieve a high level of reading ability, the students, read, translate and analyze selected short stories, poems and plays. In order to reinforce grammatical concepts, a comprehensive review of grammar (parts of speech) will be undertaken. Students will be prepared to take the Advanced Placement Spanish Language and Culture exam in the Spring. After AP Spanish IV, students may advance their studies in AP Spanish V."},{id:"ap-spanish-v",name:"AP Spanish V",code:"FL639",dept:"World Languages",group:"Spanish",level:"AP",grades:[12],credits:[1],prereq:"AP Spanish IV Language & Culture",summary:"The AP Spanish Literature and Culture course is intended to be the equivalent of a college course on Peninsular and Latin American Literature. It is a comprehensive/survey course of study. Students read a wide range of literary works from Spain and Latin America. These works range from 12th-century medieval romances to early 21st century short stories and novels. This course will prepare students to analyze the form and content of literary works, as well as to write well-organized critical essays in Spanish based on the texts read. At the end of the school year, students will be prepared to take the Advanced Placement Spanish Literature and Culture exam."},{id:"spanish-i",name:"Spanish I",code:"FL630",dept:"World Languages",group:"Spanish",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:"This course is for students who want to learn the basic structure of the Spanish language and explore Hispanic culture. This course emphasizes the development of listening, speaking, reading, and writing skills. Class participation, work completion, and good study habits are needed to form a solid language foundation. A minimum of 15-30 minutes each day is needed to complete homework. This course includes oral presentations, group work, and collaboration."},{id:"spanish-ii",name:"Spanish II",code:"FL631",dept:"World Languages",group:"Spanish",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"Spanish I",summary:"Spanish II is a continuation of Spanish I with more focus on grammar. Students continue to develop listening, speaking, reading and writing skills through a variety of written and oral activities. Students will also explore cultures from Spanish speaking countries. Spanish is generally spoken in the class, but English is used by the teacher to clarify concepts. The course requires daily practice, collaboration, and active participation; all are needed to reinforce a strong language foundation. A minimum of 15-30 minutes each day is needed to complete assignments."},{id:"spanish-iii",name:"Spanish III",code:"FL635",dept:"World Languages",group:"Spanish",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Spanish II",summary:"This course, along with Spanish 3 Pre-AP, is offered to students with foundational Spanish skills from levels 1 and 2 who want to continue developing their listening, reading, writing, and speaking skills are encouraged to take the class. The focus is on increasing one's vocabulary and knowledge of grammar to support language proficiency. Spanish is generally spoken in the class, but English is used as needed to clarify concepts. A minimum of 15-30 minutes each day is needed to complete homework. Projects and oral presentations are major components of the Spanish 3 curriculum. Spanish III prepares students to continue into Spanish IV."},{id:"spanish-iii-honors",name:"Spanish III Honors",code:"FL634",dept:"World Languages",group:"Spanish",level:"Honors",grades:[10,11,12],credits:[1],prereq:"Spanish II",summary:"This highly structured academic course is for students with strong foundational Spanish skills from levels 1 and 2 who want to continue their study of Spanish with authentic listening and reading activities, oral presentations, complex writing assessments, and the exploration of cultures from Spanish-speaking countries. Spanish is generally spoken in class, but limited English is used to clarify concepts. A minimum of 15-30 minutes each day is needed to complete homework. Spanish III Honors prepares students to continue their study in Spanish IV AP."},{id:"spanish-iv",name:"Spanish IV",code:"FL637",dept:"World Languages",group:"Spanish",level:"On-level",grades:[11,12],credits:[1],prereq:"Spanish III or III Honors",summary:"This course is designed for students wishing to continue the study of Spanish without participating in the Advanced Placement program. Students will continue to develop oral communication skills and will further explore cultures from Spanish speaking countries. Only Spanish is spoken in the classroom, but English is used occasionally by the teacher to clarify concepts. Students must be willing to use only Spanish in the classroom. Spanish IV prepares students to continue their study in Spanish V."},{id:"spanish-v",name:"Spanish V",code:"FL636",dept:"World Languages",group:"Spanish",level:"On-level",grades:[11,12],credits:[1],prereq:"Spanish IV or IV AP",summary:"This course is designed for students wishing to continue the study of Spanish without participating in the AP program. Students will continue to develop communication skills through a variety of written and oral activities, as well as increase their knowledge of Hispanic culture and history. In addition to textbook work, students' vocabulary will also increase with computer projects and reading selections. As in Spanish IV, Spanish is spoken exclusively by both the teacher and students. Active student participation, especially in the area of speaking, is an essential part of the course. This course is not designed to prepare a student to advance to AP Spanish Literature and Culture."},{id:"spanish-vi-advanced",name:"Spanish VI Advanced",code:"FL640",dept:"World Languages",group:"Spanish",level:"Post AP",grades:[11,12],credits:[1],prereq:"Spanish V AP",flags:["Post AP"],summary:"This post-AP independent study course is designed for students who have taken 5 levels of Spanish and wish to continue studying Spanish in high school. The teacher and student will determine topics of interest to read and research, and the student's progress will be evaluated through classwork, quizzes, tests, presentations, projects, and discussions with the teacher. The student can expect to work and problem-solve alone most of the time, with the teacher serving as supervisor and mentor."},{id:"ap-art-history",name:"AP Art History",code:"VA029",dept:"Fine Arts",group:"Art History",level:"AP",grades:[9,10,11,12],credits:[1],prereq:"None",fee:!0,summary:`The AP Art History course is equivalent to a two-semester introductory college course that explores topics such as the nature of art, art making, and responses to art. By investigating a specific image set of 250 works of art characterized by diverse artistic traditions from prehistory to the present, the course fosters in-depth, holistic understanding of the history of art from a global perspective. Students become active participants in the global art world, engaging with its forms and content, as they experience, research, discuss, read, and write about art, artists, art making, and responses to and interpretations of art. Students with an interest in world history, literature, and/or fine arts are encouraged to take this course.

For more information on AP Art History course requirements, go to the College Board website:

http://apcentral.collegeboard.com/apc/public/courses/descriptions/index.html`},{id:"art-historical-methods",name:"Art Historical Methods",code:"VA036",dept:"Fine Arts",group:"Art History",level:"On-level",grades:[10,11,12],credits:[1],prereq:"AP Art History",fee:!0,summary:"This course provides an advanced introduction to the methodologies used by art historians. By focusing on several outstanding historical and critical readings, as well as discussions and project-based learning, the student will be introduced to some of the major methodologies that have shaped the field: formalism, biographical analysis, connoisseurship, museum curation, brain-based learning, color theory, iconographical analysis, psychoanalytic theory, Marxist theory and the social history of art, gender theory, forgery and authentication, and art direction. Each student may choose art works of particular interest through which to apply these critical lenses. This course receives the same weight as an AP course."},{id:"art-historical-methods-ii",name:"Art Historical Methods II",code:"VA037",dept:"Fine Arts",group:"Art History",level:"On-level",grades:[11,12],credits:[1],prereq:"Completion of AP Art History, Art Historical methods AND teacher approval required",fee:!0,summary:"This course provides an opportunity for students to choose an area of art to study in greater depth. Students may opt to focus on an art movement, a theme or issue, or comparative perspective, a particular artist, or even one particular work of art. Students will work independently with as much support as they desire, having access to UT library resources. Students ultimately will prepare a thesis-level study consisting of four chapters. This course receives the same weight as an AP course."},{id:"concert-band",name:"Concert Band",dept:"Fine Arts",group:"Band",level:"On-level",grades:[9,10,11,12],credits:[.5],prereq:"Audition only",note:"Supplemental Band Fee Required",fee:!0,summary:`Participation Fee

vals. The Chap Band begins rehearsals in late July during a summer band camp. Once school begins rehearsals are scheduled before school and one night per week through mid November.

:"AP",grades:[11,12],credits:[1],prereq:"Teacher Approval",flags:["Elective"],summary:"The AP Music Theory course corresponds to two semesters of a typical introductory college music theory course that covers topics such as musicianship, theory, musical materials, and procedures. Musicianship skills including dictation and other listening skills, sight-singing, and keyboard harmony are considered an important part of the course. Through the course, students develop the ability to recognize, understand, and describe basic materials and processes of music that are heard or presented in a score. Development of aural skills is a primary objective. Performance is also part of the learning process. Students understand basic concepts and terminology by listening to and performing a wide variety of music. Notational skills, speed, and fluency with basic materials are emphasized."},{id:"technical-theatre-i",name:"Technical Theatre I",code:"PA520",dept:"Fine Arts",group:"Technical Theatre",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",fee:!0,summary:`Participation Fee

Technical Theatre I is an introductory course for all students new to the technical theatre program at Westlake High School. It provides an exploration of the many aspects of stagecraft across the theatre, music, and themed entertainment industries. Emphasis is placed on safe practices and collaboration, while students learn to use the tools, equipment, and techniques of the fundamental technical systems found in a theatre. While a student enrolled in this course is not required to participate in after-school activities and productions, they are encouraged and provided many opportunities to do so.`},{id:"technical-theatre-ii",name:"Technical Theatre II",code:"PA522",dept:"Fine Arts",group:"Technical Theatre",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Technical Theatre I",note:"Instructor Approval",fee:!0,summary:`Participation Fee

Technical Theatre II is an advanced course for students continuing in the technical theatre program. Emphasis is placed on safe practices and leadership, while students learn to use the advanced technical systems found in a theatre. Students will learn how to implement technical elements into a production or event by participating in after-school activities. A student enrolled in this course should expect to participate on the crew of at least one production, one event, and some after-school sessions during each semester as a portion of their coursework.`},{id:"technical-theatre-iii",name:"Technical Theatre III",code:"PA528",dept:"Fine Arts",group:"Technical Theatre",level:"On-level",grades:[11,12],credits:[1],prereq:"Technical Theatre II",note:"Director Approval",fee:!0,summary:`Participation Fee

Technical Theatre III is an advanced course for students who have taken Technical Theatre II. Emphasis is placed on continuing to develop safe practices and leadership skills, while students learn the design process in the theatre. Students will learn to apply design processes for different technical elements while focusing on collaboration among designers, directors, and technicians in the theatre. A student enrolled in this course should expect to participate on the crew of at least one production, one event, and some after-school sessions during each semester as a portion of their coursework.`},{id:"technical-theatre-production-i",name:"Technical Theatre Production I",code:"PA526",dept:"Fine Arts",group:"Technical Theatre",level:"On-level",grades:[11,12],credits:[1],prereq:"Technical Theatre II",note:"Instructor Approval Participation Fee: $275.00",fee:!0,summary:"This full-year co-curricular course allows students to apply skills learned in Technical Theatre I and II to a full season of professional-level productions and events throughout the year. While the class does meet during the school day, it does not meet daily. Therefore, credit for this course is earned through extensive participation outside of the school day. Students should expect to participate in a minimum of one major production, one event, and many after-school sessions during each semester."},{id:"technical-theatre-production-ii",name:"Technical Theatre Production II",code:"PA527",dept:"Fine Arts",group:"Technical Theatre",level:"On-level",grades:[11,12],credits:[1],prereq:"Technical Theatre II",note:"Instructor Approval",fee:!0,summary:`Participation Fee
