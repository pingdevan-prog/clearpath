s",group:"Core English",level:"AP",grades:[11],credits:[1],prereq:"English II (suggested grade of 90+), or English II Pre-AP (suggested grade of 85+)",summary:"This course will emphasize the ability to think abstractly, requiring students to demonstrate strong critical thinking skills of analysis, evaluation, and synthesis through participation in classroom discussion and writing. Students will be expected to manage extensive and challenging reading and writing assignments. The course will emphasize reading of non-fiction books, essays, articles, visual rhetoric, and speeches and will also include reading fiction, drama, and poetry. Independent reading will be required. Students will be expected to conduct guided and independent research and to compose in-class timed writings, longer process compositions, and a multimedia project. Preparation for the Advanced Placement exam and the SAT will include units on vocabulary, style, and the critical study of language. Students will be strongly encouraged to take the AP Language and Composition test in the spring."},{id:"dual-credit-engl-1301-1302",name:"Dual Credit ENGL 1301/1302",code:"LA122D",dept:"Language Arts",group:"Core English",level:"Dual credit",grades:[11],credits:[1],prereq:"English 2",note:"Successful completion of the course will result in credit of ENGL 1301 and ENGL 1302 through ACC",flags:["Dual Credit","New Course"],summary:`English 1301: Intensive study of and practice in writing processes, from invention and researching to drafting, revising, and editing, both individually and collaboratively. Emphasis on effective rhetorical choices, including audience, purpose, arrangement, and style. Focus on writing the academic essay as a vehicle for learning, communicating, and critical analysis.

English 1302: Intensive study of and practice in the strategies and techniques for developing research-based expository and persuasive texts. Emphasis on effective and ethical rhetorical inquiry, including primary and secondary research methods; critical reading of verbal, visual, and multimedia texts; systematic evaluation, synthesis, and documentation of information sources; and critical thinking about evidence and conclusions.`},{id:"english-i",name:"English I",code:"LA106",dept:"Language Arts",group:"Core English",level:"On-level",grades:[9],credits:[1],prereq:"Language Arts, 8th Grade",summary:"The English I course emphasizes higher-level thinking and fosters enthusiasm for reading and writing. Students will explore classic and contemporary literature, including short stories, poetry, novels, essays, and plays. During each unit, we will analyze literary techniques and text structures. Through each text we will examine how authorial strategies intersect with students' individual experiences and responses. Students will use this deep understanding of authors' craft and purpose to compose their own extended writing pieces throughout the year. English 1 students will practice increasing autonomy as they develop their identity as readers and writers. Ninth grade students will take the STAAR English I test in the spring semester. This is an End-of-Course exam each student must pass to graduate high school by Texas state law. All assignments in English 1 are geared towards teaching the standards that will be assessed on the STAAR."},{id:"english-i-honors",name:"English I Honors",code:"LA102",dept:"Language Arts",group:"Core English",level:"Honors",grades:[9],credits:[1],prereq:"Language Arts, 8th Grade (suggested grade of 90+) or 8th Grade Pre-AP (suggested grade of 85+)",summary:"This is an advanced-level, accelerated paced, reading and writing intensive course for students who genuinely enjoy and are interested in challenging themselves as readers and writers. In this course, emphasis is placed on literary analysis writing in which students examine an author's craft for meaning and tone. Close reading of passages in which students annotate for literary devices and elements is also an integral part of the course. Students will read and study whole class novels, plays, short stories, and poetry. There will be major grade process writing assignments and projects. There will be frequent daily writing grades, discussions, periodic research, and outside reading. Students will be expected to independently manage reading and writing assignments and will be expected to demonstrate strong critical thinking skills of analysis, evaluation, and synthesis through participation in classroom discussion and writing."},{id:"english-ii",name:"English II",code:"LA114",dept:"Language Arts",group:"Core English",level:"On-level",grades:[10],credits:[1],prereq:"English I",summary:"This course will focus on examining author's voice as well as stylistic and rhetorical choices that authors make in their writing. Students will practice incorporating these skills into their own writing. Students will read novels, short pieces of nonfiction, and poetry and will express their knowledge and understanding of topics through multi-platform projects and assignments. Students will explore narrative writing in Writer's Notebooks. They will also be expected to read independently. Major assignments will include public speaking opportunities, a persuasive essay and a research paper."},{id:"english-ii-honors",name:"English II Honors",code:"LA117",dept:"Language Arts",group:"Core English",level:"Honors",grades:[10],credits:[1],prereq:"English I",summary:"This course combines higher-level thinking skills with independent reading and study. Emphasis will be placed on Advanced Placement preparation, critical study of literature, guided and independent research, and papers of critical analysis. This course also includes study of syntactical structures for effective writing. The English II Pre-AP student will be expected to handle extensive and challenging reading and writing assignments on a daily basis. There will be frequent special projects, major composition assignments, and outside reading."},{id:"english-iii",name:"English III",code:"LA122",dept:"Language Arts",group:"Core English",level:"On-level",grades:[11],credits:[1],prereq:"English II",summary:"This course incorporates both a chronological and thematic approach to the study of American literature with emphasis on reading comprehension and literary analysis. Students will complete formal and informal writing assignments, focusing on improving language usage and developing ideas. Students will also complete units of vocabulary in preparation for the SAT/ACT and will conduct a research unit on college and career possibilities. Novels will include Of Mice and Men and Into the Wild."},{id:"english-iv",name:"English IV",code:"LA132",dept:"Language Arts",group:"Core English",level:"On-level",grades:[12],credits:[1],prereq:"English III",summary:"This course provides an intensive study of composition during which students will employ the stages of the composition process including prewriting, writing, and revision. The course also includes an in-depth study of British and other selected literature with historical background, literary analysis, and outside reading assignments, as well as discussion and writing."},{id:"creative-writing-i",name:"Creative Writing I",code:"LA136",dept:"Language Arts",group:"Electives",level:"On-level",grades:[9,10,11,12],credits:[.5],prereq:"None",flags:["Elective"],summary:`This course does not satisfy the Eanes ISD graduation requirements for English.

AP Seminar is a foundational course that engages students in cross-curricular conversations that explore the complexities of academic and real-world topics and issues by analyzing divergent perspectives. Using an inquiry framework, students practice reading and analyzing articles, research studies, and foundational, literary, and philosophical texts; listening to and viewing speeches, broadcasts, and personal accounts; and experiencing artistic works and performances. Students learn to synthesize information from multiple sources, develop their own perspectives in written essays, and design and deliver oral and visual presentations, both individually and as part of a team. Ultimately, the course aims to equip students with the power to analyze and evaluate information with accuracy and precision in order to craft and communicate evidence-based arguments. AP Seminar is the first of two courses in the AP Capstone program. AP Research is the second course.`},{id:"english-independent-study-ii-ap-capstone-research",name:"English Independent Study II (AP Capstone: Research)",code:"LA146",dept:"Language Arts",group:"Electives",level:"AP",grades:[11,12],credits:[1],prereq:"English Independent Study I (AP Capstone: Seminar)",flags:["Elective"],summary:`The following course does not satisfy the Eanes ISD graduation requirements for English.

AP Research, the second course in the AP Capstone experience, allows students to deeply explore an academic topic, problem or issue of individual interest. Students design, plan, and conduct a yearlong investigation to address a research question. Through this inquiry, they further the skills acquired in the AP Seminar course by learning research methodology, employing ethical research practices, and accessing, analyzing, and synthesizing information. Students reflect on their skill development, document their processes, and curate the artifacts of their scholarly work through a process and reflection portfolio. The course culminates in an academic paper of approximately 4,000-5,000 words (accompanied by a performance, exhibit or product where applicable) and a presentation with an oral defense.`},{id:"fine-arts-magazine-the-final-draft",name:"Fine Arts Magazine: the Final Draft",code:"LA193",dept:"Language Arts",group:"Electives",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",flags:["Elective"],summary:`This course does not satisfy the Eanes ISD graduation requirements for English.

II honors",note:"Graphing calculator required.",summary:"AP Precalculus follows the syllabus of the College Board Advanced Placement program. In addition to the content specified in the Pre-Calculus course description (see above), the honors sequence focuses on application of concepts in a problem-solving environment. New concepts depend on strong Algebra II and Geometry skills. Students learn how to observe, explore, and build mathematical meaning from dynamic systems. They will build deep mastery of modeling and functions, as they examine scenarios through multiple representations. AP Precalculus will strengthen student's procedural and symbolic fluency skills needed for higher level mathematics. While studying each function type, students solve equations and construct equivalent analytic representations in both contextual and purely mathematical settings. Students enrolled in this course will be prepared for the AP Precalculus exam in May. Successful completion of this course will prepare students for entry into an AP Calculus course or college calculus course."},{id:"ap-statistics",name:"AP Statistics",code:"MA262",dept:"Mathematics",level:"AP",grades:[],credits:[1],prereq:"Algebra II",note:"Graphing Calculator required",summary:"AP Statistics covers topics included in a one-semester college course, which adheres to the syllabus of the College Board Advanced Placement program. Topics studied include data collection and analysis, probability and inference. It prepares the college-bound student for possible advanced standing credit in statistics at the college level. The Advanced Placement Exam in statistics may be taken at the end of the course. Because of the level of maturity and life experience necessary to apply the concepts in real world contexts, only students in grades 10-12 may enroll."},{id:"algebra-i",name:"Algebra I",code:"MA224",dept:"Mathematics",level:"On-level",grades:[],credits:[1],prereq:"None",note:"Graphing Calculator required",summary:"This course emphasizes the development of skills, techniques and applications that deal with number relations, linear equations, formulas, polynomials, graphing, systems of equations, factoring, rational expressions, data analysis, quadratic, and exponential functions. Students will learn the skills associated with the mathematical process TEKS: problem-solving, appropriate use of tools, mathematical communication, multiple representations, reasoning, proof, and justification. Successful completion of this sequence will prepare students for entry into a geometry course."},{id:"algebra-i-honors",name:"Algebra I Honors",code:"MA223",dept:"Mathematics",level:"Honors",grades:[],credits:[1],prereq:"In order to be successful in this course it is recommended that you have an 85% or higher in 8th grade honors",note:"Graphing Calculator required",summary:"Honors Algebra 1 is a rigorous course designed for students ready to engage deeply with foundational algebraic concepts while building the skills necessary for success in the honors and AP mathematics sequence at Westlake High School. Aligned with the Texas Essential Knowledge and Skills (TEKS) for Algebra 1, the course covers linear, quadratic, and exponential functions; systems of equations and inequalities; polynomial operations and factoring; and the analysis of functions through multiple representations, including tables, graphs, equations, and verbal descriptions. Rather than treating these topics in isolation, the course emphasizes real-world applications, requiring students to model authentic situations, interpret results in context, and justify their reasoning through both written and verbal explanations. While grounded in the TEKS, this course extends beyond state standards, introducing enrichment topics and higher-order problem-solving strategies that challenge students to think with greater depth, flexibility, and mathematical maturity. This course lays the groundwork for continued success in Honors Geometry, Honors Algebra 2, and eventual AP-level mathematics courses."},{id:"algebra-ii",name:"Algebra II",code:"MA245",dept:"Mathematics",level:"On-level",grades:[],credits:[1],prereq:"Geometry",note:"Graphing Calculator required",summary:"This course builds on the foundations of Algebra 1, emphasizing advanced algebraic concepts, critical thinking, and problem-solving skills. Students explore a variety of function families—including linear, quadratic, polynomial, radical, rational, exponential, logarithmic, and absolute value functions—through graphing, transformations, and real-world applications. Additional topics include systems of equations, matrices, inverse functions, and the complex number system. Students will use graphing calculators and technology tools to model data, verify solutions, and communicate mathematical reasoning. Algebra 2 strengthens students' understanding of the mathematical process standards (TEKS): problem-solving, reasoning, communication, representation, and justification. Successful completion of this course prepares students for Precalculus."},{id:"algebra-ii-honors",name:"Algebra II Honors",code:"MA240",dept:"Mathematics",level:"Honors",grades:[],credits:[1],prereq:"In order to be successful in this course it is recommended that you have an 85% or higher in Geometry honors",note:"Graphing Calculator required",summary:"In addition to the content specified in the Algebra II course description (see above), the honors sequence focuses on application of concepts in a problem-solving environment. Strong Algebra skills are essential building blocks for a deeper dive into Algebraic concepts. Successful completion of this sequence will prepare students for entry into a Pre-Calculus course."},{id:"calculus",name:"Calculus",code:"MA251",dept:"Mathematics",level:"On-level",grades:[],credits:[1],prereq:"Precalculus",note:"Graphing Calculator required",summary:"Calculus covers topics included in a one-semester college course. The course includes concepts and applications of differential and integral calculus. It moves at a slower pace than AP Calculus and will help prepare students for a college calculus course. It is a good choice for students who want to explore calculus without an emphasis on advanced algebra skills. This course uses Web Assign, an online assignment platform."},{id:"geometry",name:"Geometry",code:"MA235",dept:"Mathematics",level:"On-level",grades:[],credits:[1],prereq:"Algebra I",note:"Graphing Calculator required",summary:"This course deals with sets of points and related properties. Sets studied include lines, angles, polygons, circles, planes and surfaces of geometric solids such as pyramids, cones, cylinders and spheres. This sequence emphasizes systematic approaches to and processes for proving and applying theorems. Algebra is utilized extensively during the second semester. Students will learn the skills associated with the mathematical process TEKS: problem-solving, appropriate use of tools, mathematical communication, multiple representations, reasoning, proof, and justification. Successful completion of this sequence prepares the students for further work in algebra, usually in Algebra II."},{id:"geometry-honors",name:"Geometry Honors",code:"MA230",dept:"Mathematics",level:"Honors",grades:[],credits:[1],prereq:"In order to be successful in this course it is recommended that you have an 85% or higher in Algebra One honors",note:"Graphing Calculator required",summary:"In addition to the content specified in the Geometry course description (see above), the honors sequence focuses on application of concepts in a problem-solving environment. Strong Algebra skills are essential in the study of trigonometry second semester. Successful completion of this sequence will prepare students for entry into an Algebra II course."},{id:"linear-algebra",name:"Linear Algebra",code:"MA269",dept:"Mathematics",level:"On-level",grades:[],credits:[.5],prereq:"AP Calculus BC",note:"Offered Spring Semester Only",summary:`Graphing Calculator required

This course provides detailed study of vectors and vector spaces. Topics include solving n by n systems of equations; vector spaces; linear transformations of vector spaces; and eigenvectors and eigenvalues. The content of this course is equivalent to a one-semester college introductory linear algebra course.`},{id:"mathematical-models-with-applications",name:"Mathematical Models with Applications",code:"MA227",dept:"Mathematics",level:"On-level",grades:[],credits:[1],prereq:"Algebra I and Geometry",note:"Graphing Calculator required",summary:"In MMA students will develop, refine and strengthen their Algebra 1 skills, including using order of operations to simplify algebraic expressions. This will provide them with a better foundation for success in Algebra 2. These skills then support good problem solving strategies with equations. Equations (primarily linear) will be modelled in various ways, including graphing and tables with and without graphing calculators. From these models, solutions will be found. When appropriate, real-life applied problems will be addressed using Algebra skills to solve and sentences to explain the solution in context of the problem solved."},{id:"multivariable-calculus",name:"Multivariable Calculus",code:"MA268",dept:"Mathematics",level:"AP",grades:[],credits:[1],prereq:"AP Calculus BC AND a minimum AP Calculus BC exam score of 3, 4, or 5",note:"Offered Fall Semester Only",summary:`Graphing Calculator required

This course is a one-semester course in vector calculus. Topics include vectors, partial derivatives, multiple integrals, vector fields, line integrals, surface integrals, Green's Theorem, curl and divergence, and Stoke's Theorem. Emphasis is placed on problem-solving techniques and applications to other disciplines such as physics, economics and statistics. This course receives the same weight as an AP course.`},{id:"precalculus",name:"Precalculus",code:"MA252",dept:"Mathematics",level:"On-level",grades:[],credits:[1],prereq:"Algebra II",note:"Graphing Calculator required",summary:"This course includes the topics of polynomial, rational and algebraic functions, complex numbers, trigonometric equations, identities, inverse trigonometric functions, vectors, polar coordinates and equations, logarithms, and combinations. Students will learn the skills associated with the mathematical process TEKS: problem-solving, appropriate use of tools, mathematical communication, multiple representations, reasoning, proof, and justification. Students completing this sequence will have a strong background for on level and AP Calculus AB."},{id:"statistics",name:"Statistics",code:"MA261",dept:"Mathematics",level:"On-level",grades:[],credits:[1],prereq:"Algebra II",note:"Graphing Calculator required",summary:"Statistics covers topics included in a one-semester college course; data collection and analysis, probability and inference. It moves at a slower pace than AP Statistics and will help prepare students for a college statistics course. The emphasis is on understanding how to use statistics to address real-world problems. The use of technology is integrated throughout the course."},{id:"stats-2-beyond-ap-statistics",name:"Stats 2: Beyond AP Statistics",code:"MA270",dept:"Mathematics",level:"AP",grades:[],credits:[1],prereq:"AP Statistics & AP Statistics Exam score of 3 or higher",summary:"Stats 2: Beyond AP Statistics has three areas of study. First, students will learn advanced statistical procedures such as ANOVA, multiple regression analysis, non-parametric tests and Bayesian statistics. Topics will be presented in a broad variety of contexts such as biostatistics, political science, business and sport analytics. Second, students will conduct these analyses using the statistical coding platform RStudio. Third, students will plan and execute statistical studies proposed by members of the Westlake Community. Because of the maturity required to serve as statistical consultants, only students in grades 11-12 may enroll. This course receives the same weight as an AP course."},{id:"ut-onramps-statistics",name:"UT OnRamps Statistics",code:"MA261D",dept:"Mathematics",level:"Dual credit",grades:[12],credits:[1],prereq:"Algebra I and Algebra II recommended",note:"Students will have the option of receiving credit through UT with successful completion of the course. There is a $150 course fee per student.",fee:!0,flags:["Dual Credit","New Course","OnRamps"],summary:"This introductory course covers the basic foundations of data science. Students use interactive applications to explore topics like frequency distributions, sampling, experimental design, inference and regression — all while building mathematical literacy. Hands-on data analysis, methods to extract key insights, and coding skills taught in this course are aligned to college expectations and the current career landscape. Students also develop quantitative reasoning skills and learn how to use data science across multiple disciplines."},{id:"ap-physics-1",name:"AP Physics 1",code:"SC332",dept:"Science",group:"Core Science",level:"AP",grades:[11,12],credits:[1],prereq:"Successful completion of lab-based Chemistry or lab-based Physics taken on a high school or college campus and concurrent enrollment or successful completion of Pre-Calculus",note:"Credits earned through online programs such as the University of Texas or Texas Tech high school programs do not have a laboratory component that will satisfy the prerequisites for enrollment in any AP science courses. Summer and Online offerings lack the rigor and quantity of content necessary to adequately prepare students for our Westlake High School AP science courses and do not satisfy the prerequisites for this class.",summary:"AP Physics 1 is equivalent to a first semester college algebra-based Physics course. Students are required to integrate their math abilities with science knowledge, reading comprehension and problem-solving skills to be successful. This course will cover in detail Newtonian Mechanics (including rotational dynamics and angular momentum), work, energy, simple harmonic motion, and fluid dynamics. By the end of the year students will be prepared to take the AP Physics 1 exam. Upon completion of this course, students may continue their physics studies in Modern Physics or AP Physics 2."},{id:"ap-physics-2",name:"AP Physics 2",code:"SC333",dept:"Science",group:"Core Science",level:"AP",grades:[12],credits:[1],prereq:"Successful completion of AP Physics 1 taken on a high school or college campus",note:"Credits earned through online programs such as the University of Texas or Texas Tech high school programs do not have a laboratory component that will satisfy the prerequisites for enrollment in any AP science courses. Summer and Online offerings lack the rigor and quantity of content necessary to adequately prepare students for our Westlake High School AP science courses and do not satisfy the prerequisites for this class.",summary:"AP Physics 2 is equivalent to a second semester college algebra-based Physics course. Students are required to integrate their math abilities with science knowledge, reading comprehension and problem-solving skills to be successful. This course is an application and extension of AP Physics 1 skills and requires a strong understanding of the algebra based Newtonian Mechanics. AP Physics 2 will cover in detail Thermodynamics, Electrostatics, Circuits, Magnetism, Geometric/Physical Optics, and Modern/Atomic Physics. By the end of the year students will be prepared to take the AP Physics 2 exam."},{id:"ap-physics-i-2",name:"AP Physics I & 2",code:"SC335",dept:"Science",group:"Core Science",level:"AP",grades:[11,12],credits:[2],prereq:"Successful completion of Lab-Based Chemistry taken on a high school or college campus and concurrent enrollment or successful completion of Pre-Calculus. Honors or AP Pre-Calculus is highly suggested. If the student takes lab-based on-level physics on a high school or college campus, then any chemistry credit will be accepted",note:"Credits earned through online programs such as the University of Texas or Texas Tech high school programs do not have a laboratory component that will satisfy the prerequisites for enrollment in any AP science courses. Summer and Online offerings lack the rigor and quantity of content necessary to adequately prepare students for our Westlake High School AP science courses and do not satisfy the prerequisites for this class.",summary:`*GPA points will be awarded for one credit only*

AP Physics 1&2 is equivalent to a full year freshman college level algebra-based Physics course. A steady pace is maintained throughout the year in order to master the objectives outlined by the College Board. Students are required to integrate their math abilities with science knowledge, reading comprehension and problem-solving skills in order to be successful. By the end of the year students should be prepared to take the AP Physics 1 and 2 exams and/or the SAT II subject exam. In addition students will have the prerequisite knowledge and skills to take future calculus based physics courses. GPA points are only given to the first of the two-credit courses.`},{id:"anatomy-and-physiology-honors",name:"Anatomy and Physiology (Honors)",code:"SC340",dept:"Science",group:"Core Science",level:"Honors",grades:[11,12],credits:[1],prereq:"Biology I Honors and Chemistry or IPC or Physics; Medical Terminology is highly recommended",alsoIn:["Technology & Career Education"],flags:["Elective"],summary:"Anatomy and Physiology is designed to meet the needs of the student who plans to major in biological health-oriented sciences, or is an intellectually curious non-science major. The first semester focuses on the organization of the human body, embryological development, and support and movement. The second semester concentrates on integration and control, maintenance, and reproduction. The textbooks used for the course are those used by colleges for their introductory courses. Laboratory exploration includes topics and experiments used in the medical laboratory. Diagnostic procedures and results will supplement the lectures. Students will have research assignments each semester using peer-reviewed sources and scientific medical journals. A large animal dissection is required for this course. This course receives the same weight as an Honors course."},{id:"biology-i",name:"Biology I",code:"SC310",dept:"Science",group:"Core Science",level:"On-level",grades:[9],credits:[1],prereq:"None",summary:"Biology is the study of living things. This course covers a variety of topics focused around five central themes: cell structure and function; mechanisms of genetics; biological evolution and classification; biological processes and systems; and interdependence within environmental systems. This program promotes scientific thinking through problem-solving, a process that encourages curiosity and careful inquiry. The teaching method will center on active student learning revolving around class work, group work, and laboratory investigations."},{id:"biology-i-honors",name:"Biology I Honors",code:"SC311",dept:"Science",group:"Core Science",level:"Honors",grades:[9],credits:[1],prereq:"A grade of 90 or higher in the student's 8th grade science class is strongly recommended",summary:"Biology I Honors is an advanced course designed for the first-year biology student who has the interest to pursue a major in biological sciences. Special emphasis is on three areas of study: molecules and cells; heredity and evolution; and organisms and populations. Pervasive in these three areas are eight major themes: science as a process, evolution, energy transfer, continuity and change, relationship of structure to function, regulation, interdependence in nature, and science, technology and society. Traditionally students successful in Biology I Honors have strong reading comprehension skills, and have a willingness to invest sufficient outside time for enrichment assignments."},{id:"biotechnology",name:"Biotechnology",code:"SC316",dept:"Science",group:"Core Science",level:"On-level",grades:[11,12],credits:[1],prereq:"Biology and Chemistry",alsoIn:["Technology & Career Education"],flags:["Elective"],summary:"This course is an introduction to biotechnology including career exploration, history, and applications of DNA/RNA technology, molecular biology, bioethics, cell culturing, engineering, and laboratory safe practices. This course is supplemented with laboratory exercises, and demonstrations that illustrate the basic techniques of biotechnology. The course concludes with a consideration of bioethical issues relating to this powerful new technology."},{id:"chemistry-i",name:"Chemistry I",code:"SC320",dept:"Science",group:"Core Science",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Credit for Algebra 1 and completion of lab-based biology taken on a high school or college campus",summary:"This course is designed to look at both the practical and theoretical aspects of chemistry. Students will build on topics learned in previous sciences, such as unit conversions and laboratory measurement. Students will also conduct investigations to study a variety of topics that include nomenclature, reactions, periodicity, stoichiometry, kinetics, electrochemistry, and nuclear chemistry. There is a large emphasis on mathematical calculations and laboratory skills."},{id:"chemistry-i-honors",name:"Chemistry I Honors",code:"SC321",dept:"Science",group:"Core Science",level:"Honors",grades:[10,11,12],credits:[1],prereq:"Completion of Geometry, concurrent enrollment or completion of Algebra II and successful completion of lab-based Biology taken on a high school or college campus",summary:"This course is designed to provide the student interested in enrolling in a college level class, either Chemistry AP at Westlake or later in college, with a strong background in chemical topics. The course will be taught at a rigorous pace, and the curriculum will cover the higher-level topics of thermodynamics, equilibrium, kinetics, and electrochemistry. Knowledge of certain topics covered in physical science will be assumed, and if lacking, individual outside preparation will be necessary. There is a large emphasis on mathematical calculations throughout the year, based on concepts learned while taking Algebra II. The laboratory component of the course will be modeled after a college laboratory. Many of the labs will involve the use of technology in the collection of data."},{id:"engineering",name:"Engineering",code:"SC350",dept:"Science",group:"Core Science",level:"On-level",grades:[11,12],credits:[1],prereq:"Algebra 1, Geometry, and a level 2 STEM course. (Robotics 1 or higher, CAD, Mentorship, Computer Science Principles or Computer Science AP or higher)",alsoIn:["Technology & Career Education"],flags:["Elective"],summary:`This is a high-level, hands-on science and engineering course. Through self and peer evaluation, Engineering requires students to interact verbally, in writing, and through improving the performance of devices. This course is designed to engage students in authentic engineering practices in a project-based environment. Students will complete a series of relevant design challenges to develop engineering design skills and habits of mind. This is a survey engineering course where students will work in design teams to solve challenges related to various engineering disciplines including mechanical; civil; electrical; systems; and reverse engineering. The course will require the purposeful application of engineering principles, along with relevant science, technology, and mathematics concepts. This course receives the same weight as an Honors course.

During the fall semester, students will have the option to apply to take the spring semester of the course for dual credit through UT Austin.`},{id:"integrated-physics-and-chemistry",name:"Integrated Physics and Chemistry",code:"SC301",dept:"Science",group:"Core Science",level:"On-level",grades:[10],credits:[1],prereq:"None",summary:"This course uses a laboratory approach to integrate the disciplines of physics, mathematics, and chemistry in the following topics: motion, waves, energy transformations, properties of matter, changes in matter, and solution chemistry. Knowledge of certain math skills such as graphing, basic algebra and problem-solving are essential. This course is encouraged for those students needing a solid background for both disciplines whether or not the student will be pursuing Chemistry I and/or Physics I enrollment. Students may not be concurrently enrolled or have passed Chemistry or Physics. IPC taken in the 8th grade prior to the 2021-2022 school year will earn elective credit."},{id:"modern-physics",name:"Modern Physics",code:"SC337",dept:"Science",group:"Core Science",level:"On-level",grades:[11,12],credits:[1],prereq:"Completion of a first year of Physics course and completion or concurrent enrollment in Pre-Calculus",flags:["Elective"],summary:"Modern Physics is designed to provide an overview of advancements in physics since the 1900s. This course will require students to think critically about some of the most complex and important ideas in our modern understanding of the universe. Major fields of study are general and special relativity, quantum mechanics, particle physics, unification, and cosmology. Students will learn about the physicists who challenged classical ideas and their experiments that defied explanation and ushered in a revolution in physics. The course is intended for students who have completed a foundational course in physics and have a rigorous understanding of classical laws"},{id:"physics-i",name:"Physics I",code:"SC331",dept:"Science",group:"Core Science",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Completion of Geometry, concurrent enrollment or completion of Algebra II, and successful completion of lab-based biology taken on a high school or college campus",summary:"This course is an investigation of fundamental laws of physics that govern our universe. There is a large emphasis on problem solving through algebraic calculations, group work in laboratory settings, and quarterly projects. Major fields of study are kinematics, forces, conservation laws, electricity, waves, and modern physics. Students will execute labs to research and determine these physical laws and ascertain their mathematical nature. Upon completion of this course, students may continue their physics studies in Modern Physics or AP Physics 1."},{id:"robotics-iii",name:"Robotics III",code:"SC356",dept:"Science",group:"Core Science",level:"On-level",grades:[12],credits:[1],prereq:"Robotics II, and Teacher Approval",note:"Satisfies Science Credit",fee:!0,alsoIn:["Technology & Career Education"],flags:["Elective"],summary:`Participation Fee

This class, which requires extracurricular participation, is focused on the FIRST Robotics Contest program and contest teams. This class is designed for students wishing to increase skills and knowledge about aspects related to the robotics team including engineering, programming, leadership and shop tools. Students will participate in all robotics contests and serve in leadership positions on the robotics competitive team. Each student will be responsible for creating a portfolio about a research project related to the competitive robotics team. Students will be required to be full participants in designated work sessions and team meetings twice a week after school during Fall semester weekly meetings and on 4 weekdays and Saturdays during January-March. FRC students are expected to attend at least one tournament. FTC students are expected to attend all local tournaments. This course receives the same weight as an Honors course.`},{id:"ap-biology",name:"AP Biology",code:"SC315",dept:"Science",group:"Electives",level:"AP",grades:[11,12],credits:[1],prereq:"Successful completion of an in-person hands-on lab-based Biology I and Chemistry I taken on a high school or college campus and completion of Algebra II",note:"Credits earned through online programs such as the University of Texas or Texas Tech high school programs do not have a laboratory component that will satisfy the prerequisites for enrollment in any AP science courses. Summer and Online offerings lack the rigor and quantity of content necessary to adequately prepare students for our Westlake High School AP science courses and do not satisfy the prerequisites for this class.",flags:["Elective"],summary:"Advanced Placement Biology is designed to be the equivalent of a college introductory biology course, and only open to Juniors and Seniors. Biology II AP meets the needs of the student who plans to major in science or an allied field as well as the intellectually curious non-science major. The course is designed to be taken by students after the successful completion of a first course in biology and chemistry. The syllabus was developed by the AP Biology committee. Three broad areas of study include molecules and cells, genetics and evolution, and organisms and populations. The textbooks used for the course are those used by colleges for their introductory courses. Laboratory experiments include topics and equipment used in college laboratories."},{id:"ap-chemistry",name:"AP Chemistry",code:"SC325",dept:"Science",group:"Electives",level:"AP",grades:[11,12],credits:[1],prereq:"Successful completion of Algebra II and Chemistry Honors (SC321) taken on a high school or college campus. If a student took Chemistry (SC320) in lieu of Chemistry Honors, they may be eligible for enrollment in AP Chemistry if they 1) Received an A course average in the SC320 and 2) Complete a summer assignment covering necessary foundational topics not covered in SC320",note:"Credits earned through online programs such as the University of Texas or Texas Tech high school programs do not have a laboratory component that will satisfy the prerequisites for enrollment in any AP science courses. Summer and Online offerings lack the rigor and quantity of content necessary to adequately prepare students for our Westlake High School AP science courses and do not satisfy the prerequisites for this class",flags:["Elective"],summary:"AP Chemistry meets the needs of the student who plans to major in science, engineering, premed or other applied fields. Students who do not take the AP exam should be well prepared for freshman chemistry in college. Like freshman college chemistry, this course is lab- oriented and requires strong math skills and also non-math problem-solving skills. A strict time schedule will be adhered to in order to cover all of the required material before the AP test the first week in May."},{id:"ap-environmental-science",name:"AP Environmental Science",code:"SC341",dept:"Science",group:"Electives",level:"AP",grades:[11,12],credits:[1],prereq:"Successful completion of an in-person hands-on lab-based Biology I and Chemistry I taken on a high school or college campus",note:"Credits earned through Summer and online programs, such as the University of Texas or Texas Tech high school programs, do not have a laboratory component that will satisfy the prerequisites for enrollment in an AP science course. These courses lack of rigor and content does not adequately prepare students for AP science courses.",flags:["Elective"],summary:"This course is designed to be the equivalent of a college introductory environmental science course. The course integrates the sciences, including biology, chemistry, and earth science with the social sciences to analyze contemporary environmental problems, such as pollution, resource acquisition, biodiversity, global warming and overpopulation. Students will examine alternative solutions for resolving and/or preventing these environmental problems. A strong laboratory and field investigation component is included. Students should have a willingness to invest sufficient outside time to engage in enrichment assignments."},{id:"ap-physics-c",name:"AP Physics C",code:"SC334",dept:"Science",group:"Electives",level:"AP",grades:[12],credits:[2],prereq:"Successful completion of AP Physics 1 & 2 taken on a high school or college campus and concurrent enrollment or successful completion of AP Calculus required",note:"Credits earned through online programs such as the University of Texas or Texas Tech high school programs do not have a laboratory component that will satisfy the prerequisites for enrollment in any AP science courses. Summer and Online offerings lack the rigor and quantity of content necessary to adequately prepare students for our Westlake High School AP science courses and do not satisfy the prerequisites for this class.",flags:["Elective"],summary:`*GPA points will be awarded for one credit only.

AP Physics C is a full-year calculus based physics course to prepare students to take two Advanced Placement Physics C examinations.* This course covers the topics of vectors; kinematics; free-fall; two-dimensional motion; Newton's Laws of Motion; friction; work; energy; linear momentum and collisions; rotational kinematics and dynamics; equilibrium; oscillations; gravitation; Coulomb's Law and electric field; Gauss's Law of Electrostatics and potential; capacitors and dielectrics; circuits; magnetic field; Ampere's Law; Biot-Savart Law; Faraday's Law of Induction and Inductance; Inductive-Capacitive circuits; Maxwell's Equations of Electromagnetism. A two-week review for the Advanced Placement Physics C exams will be provided.

*Students who complete this course will be eligible to take both the AP Physics C: Electricity and Magnetism and the AP Physics C: Mechanics exams. Students will receive 2 credits for this class, though GPA points will only be awarded for the first credit.`},{id:"astronomy",name:"Astronomy",code:"SC351",dept:"Science",group:"Electives",level:"On-level",grades:[11,12],credits:[1],prereq:"Two high school science credits, completion of Algebra 1, and completion or concurrent enrollment in Geometry",flags:["Elective"],summary:"This course is designed to provide a broad overview of the universe and human's place within it. The first semester emphasizes basic astronomical concepts such as light, gravity, measurements, and motion. In addition, students will study the formation and structure of the solar system and study the Earth/Moon system and each of the other worlds. The second semester emphasizes stellar astronomy which includes stellar evolution, black holes, star clusters, galaxies, the formation of the universe, and extraterrestrial life. The topics will be examined through both class work and the laboratory."},{id:"earth-systems-science",name:"Earth Systems Science",code:"SC346",dept:"Science",group:"Electives",level:"On-level",grades:[11,12],credits:[1],prereq:"Two high school science credits, completion of Algebra 1, and completion or concurrent enrollment in Geometry",flags:["Elective"],summary:"Earth Systems Science is an upper-division science elective course that combines topics from other sciences, including astronomy, geology, climatology, chemistry, physics, and paleontology, in order to explain the processes that formed our universe, solar system, planet, and the environment around us. Students will explore the topics covered in this course using scientific inquiry and project-based learning."},{id:"environmental-systems",name:"Environmental Systems",code:"SC342",dept:"Science",group:"Electives",level:"On-level",grades:[11,12],credits:[1],prereq:"Two high school science credits, completion of Algebra 1, and completion or concurrent enrollment in Geometry",flags:["Elective"],summary:"In Environmental Systems, students conduct field and laboratory investigations and make informed decisions using critical thinking and scientific problem-solving. Students study a variety of topics including biotic and abiotic factors; ecosystems and biomes; interrelationships between species, communities and populations; sources and flow of energy and matter through an environmental system; and change in environmental systems. Students will also examine alternative solutions to preventing environmental problems."},{id:"organic-chemistry",name:"Organic Chemistry",code:"SC352",dept:"Science",group:"Electives",level:"On-level",grades:[12],credits:[1],prereq:"Completion of AP Chemistry with a minimum AP Chemistry Exam score of a 3, 4, or 5",note:"This course receives the same weight as an AP course.",flags:["Elective"],summary:"This course is intended for seniors who have a serious interest in the sciences and are considering pursuing pre-med, chemistry, or biology majors in college. This course is equivalent to a sophomore level organic chemistry class offered at the university level. Students will receive lectures and assignments equivalent in nature to a college organic class along with labs teaching basic organic techniques. As with any college class, independent learning and self-motivated study are necessary for success."},{id:"ap-business-with-personal-finance",name:"AP Business with Personal Finance",code:"SS436",dept:"Social Studies",group:"Core Social Studies",level:"AP",grades:[10,11,12],credits:[1],prereq:null,alsoIn:["Technology & Career Education"],flags:["New Course"],summary:`In this AP course, students will dive into the world of business and personal finance through real-world projects, case studies, and simulations. Whether you're dreaming of launching a startup, managing a company, or making smart money decisions in your own life, this course gives you the skills to do it confidently. You'll learn about business operations, marketing, budgeting, credit, investing, taxes, and more—while developing the leadership, communication, and problem-solving skills that employers and colleges value. Students will complete two major projects: one designing a business using a lean startup model, and another advising a fictional household on financial decisions.

Students who complete the course can take the AP exam and have the opportunity to earn both college credit and an employer-endorsed credential backed by the U.S. Chamber of Commerce.`},{id:"ap-human-geography",name:"AP Human Geography",code:"SS403",dept:"Social Studies",group:"Core Social Studies",level:"AP",grades:[9],credits:[1],prereq:"None",summary:"The purpose of the AP course in Human Geography is to introduce students to the systematic study of patterns and processes that have shaped human understanding, use, and alteration of Earth's surface. Students employ spatial concepts and landscape analysis to examine human social organization and its environmental consequences. They also learn about the methods and tools geographers use in their science and practice. In-depth concepts to be covered include population, culture, political organization, agriculture and rural land use, industrialization and economic development, and urban geography. This is a college-level course and as such the pace and rigor of the material is very advanced. Students should expect to spend 30 minutes or more each night completing homework, reading, or reviewing notes."},{id:"ap-macroeconomics",name:"AP Macroeconomics",code:"SS430",dept:"Social Studies",group:"Core Social Studies",level:"AP",grades:[12],credits:[.5],prereq:"World History, World Geography and US History (highly recommended to have taken an AP course)",note:"Students may fulfill the one-semester Economics graduation requirement by taking either AP Microeconomics or AP Macroeconomics.",summary:"This course is designed to promote the student's understanding of aggregate economic activity and the utilization of resources within and across countries. Current events are an integral part of the course, and the student will learn to evaluate the determinants of economic progress and economic decisions made by policymakers. The emphasis of the course is placed on national income and price determination, as well as economic performance measures, the financial sector, stabilization policies, economic growth, and international economics. Graphical analysis of the macro economy is an integral part of this course, as is basic algebra to calculate economic indicators. At the conclusion of the semester, the student will have covered the topics recommended by the College Board for the Advanced Placement Macroeconomics Exam."},{id:"ap-microeconomics",name:"AP Microeconomics",code:"SS431",dept:"Social Studies",group:"Core Social Studies",level:"AP",grades:[12],credits:[.5],prereq:"World History, World Geography and US History (highly recommended to have taken an AP course)",note:"Students may fulfill the one-semester Economics graduation requirement by taking either AP Microeconomics or AP Macroeconomics.",summary:"This course is designed to promote the student's understanding of the principles of economics that apply to the functions of individual decision-makers, both producers and consumers, within the economic system. The emphasis of the course is placed on the nature and functions of product markets, including detailed study of supply and demand, the theory of consumer choice, production and cost analysis, and the behavior of firms in different types of market structures. The course will also include analysis of the factor markets and the role of the government in promoting greater efficiency and equity in the economy. Graphical analysis is an integral part of this course, as is integrating basic algebraic formulas to calculate economic data. At the conclusion of the semester, the student will have covered the topics recommended by the College Board for the Advanced Placement Microeconomics Exam. For students wishing to major in Business in college, this course will provide the foundations for understanding the decision-making of firms and their interactions in a market system."},{id:"ap-united-states-government",name:"AP United States Government",code:"SS420",dept:"Social Studies",group:"Core Social Studies",level:"AP",grades:[12],credits:[.5],prereq:"World History, World Geography and US History",summary:"AP U.S. Government and Politics provides a college-level, nonpartisan introduction to key political concepts, ideas, institutions, policies, interactions, roles, and behaviors that characterize the constitutional system and political culture of the United States. You will study U.S. foundational documents, Supreme Court decisions, and other texts and visuals to gain an understanding of the relationships and interactions among political institutions, processes, and behavior. You'll also engage in disciplinary practices that require you to read, interpret data, make comparisons, applications, and develop evidence-based arguments. In addition, you'll complete a political science research or applied civics project."},{id:"ap-united-states-history",name:"AP United States History",code:"SS410",dept:"Social Studies",group:"Core Social Studies",level:"AP",grades:[11],credits:[1],prereq:"World History or AP World History",summary:"This course provides a two-semester chronological survey of American History from its Native American origins to the present. Students grapple with some of the major interpretive questions of American History by focusing on selected political, economic, social, and cultural themes. We read and analyze primary documents and historiographical interpretations. The student develops the ability to both command systematic factual knowledge and to analyze that knowledge critically. Persuasive essays are written with each unit studied. At the completion of the course the student may elect to take the Advanced Placement Exam for up to six hours of college credit. Students take 3-4 reading checks per week. Each check covers about 10 pages in the college level text. Preparation time for each check is about 1 hour each night, but may vary according to the student."},{id:"ap-world-history",name:"AP World History",code:"SS402",dept:"Social Studies",group:"Core Social Studies",level:"AP",grades:[10],credits:[1],prereq:"World Geography or AP Human Geography",summary:"The purpose of the AP World History course is to develop greater understanding of the evolution of global processes and contacts, in interaction with different types of human societies. This understanding is advanced through a combination of selective factual knowledge and appropriate analytical skills. The course highlights the nature of changes in international frameworks and their causes and consequences, as well as comparisons among major societies. It emphasizes relevant factual knowledge used in conjunction with leading interpretive issues and types of historical evidence. The course builds on an understanding of cultural, institutional, and technological precedents that, along with geography, set the human stage. Periodization, explicitly discussed, forms an organizing principle for dealing with consistent attention to contacts among societies that form the core of world history as a field of study."},{id:"economics",name:"Economics",code:"SS435",dept:"Social Studies",group:"Core Social Studies",level:"On-level",grades:[12],credits:[.5],prereq:"World History or World Geography and US History",note:"This course may be taken before or after US Government. Beginning with the class of 2030, Personal Financial Literacy becomes the graduation requirement in place of Economics.",summary:"This course provides a foundational understanding of core economic concepts and the American free-enterprise system, which will allow students to apply economic thinking and basic economic models to further understand real-world scenarios. The major units include microeconomic decision-making, economic systems, supply and demand, market structures, business organizations, macroeconomic indicators, fiscal and monetary policy, international trade, and personal finance."},{id:"personal-financial-literacy",name:"Personal Financial Literacy",code:"SS465A",dept:"Social Studies",group:"Core Social Studies",level:"On-level",grades:[12],credits:[.5],prereq:null,note:"This course is only available for students in the class of 2030 and beyond",summary:"This interactive, research-based course will contribute to the development of citizens who have the knowledge and skills to make sound, informed financial decisions that will allow them to lead financially secure lifestyles and understand personal financial responsibility. Students will apply critical-thinking and problem-solving skills to analyze decisions involving earning and spending; saving and investing; credit and borrowing; insuring and protecting; and college and postsecondary education and training."},{id:"personal-financial-literacy-and-economics",name:"Personal Financial Literacy and Economics",code:"SS467",dept:"Social Studies",group:"Core Social Studies",level:"On-level",grades:[10,11,12],credits:[.5],prereq:"None",note:"This course satisfies the Economics requirement for graduation for, and is available to take for, the class of 2027-2029. The class of 2030 and beyond should take SS465 as their graduation requirement.",flags:["Elective"],summary:"This course provides a foundation in both microeconomics and macroeconomics to foster the economic way of thinking which serves as a framework for the personal financial decision-making opportunities introduced in the course. Students will survey the impact of demand, supply, various industry structures and government policies on the market for goods, services and wages for workers. The course requires that students demonstrate critical thinking by exploring how to invest in themselves with education and skill development, earn income, and budget for spending, saving, investing and asset protection. Students will examine their individual responsibility for managing their personal finances and understand the impact on standard of living and long-term financial well-being."},{id:"united-states-government",name:"United States Government",code:"SS425",dept:"Social Studies",group:"Core Social Studies",level:"On-level",grades:[12],credits:[.5],prereq:"World History, World Geography and US History",note:"This course may be taken before or after Economics.",summary:"This course surveys the American political system beginning with the adoption of the Constitution. The major units include constitutional principles, political parties and political participation, the legislative branch, executive branch and judicial branch."},{id:"united-states-history",name:"United States History",code:"SS415",dept:"Social Studies",group:"Core Social Studies",level:"On-level",grades:[11],credits:[1],prereq:"World History or AP World History",summary:"This course provides a two-semester thematic survey of American History from Reconstruction to the present. Students grapple with some of the major themes of American History focusing on political, economic, social, and cultural evolutions. The student develops the ability to both command systematic factual knowledge and to analyze that knowledge critically. The course provides opportunities for cooperative learning, analyzing primary and secondary documents, working on historical critical writing skills, understanding how to research and correctly incorporate the research and unit projects. The course is hands-on and fast-paced. Students should expect to spend time on their own studying and completing projects. All exams and tests are cumulative."},{id:"world-geography",name:"World Geography",code:"SS400",dept:"Social Studies",group:"Core Social Studies",level:"On-level",grades:[9],credits:[1],prereq:"None",summary:"World Geography is a regional survey course designed to acquaint students with the world physically, politically, culturally, and economically. Both semesters will focus on foundational geographic concepts, skills and regional topics, and conceptual themes within various fields of geography. Cooperative learning, spatial mapping, creation tasks, and computer aided lessons are all utilized. Students also learn about the methods and tools geographers use in their science and practice."},{id:"world-history",name:"World History",code:"SS405",dept:"Social Studies",group:"Core Social Studies",level:"On-level",grades:[10],credits:[1],prereq:"World Geography or AP Human Geography",summary:"This course is the study of the historical development of man-kind from ancient civilization to the 20th century. Each unit includes general characteristics of a time period and a detailed analysis of one or two sample cultures and mapping of associated geographical features."},{id:"ap-comparative-government",name:"AP Comparative Government",code:"SS426",dept:"Social Studies",group:"Electives",level:"AP",grades:[11,12],credits:[.5],prereq:null,note:"This course does NOT satisfy the U.S. Government course graduation requirement.",flags:["Elective"],summary:"AP Comparative Government and Politics introduces students to the rich diversity of political life outside the United States. The course uses a comparative approach to examine the political structures; policies; and political, economic, and social challenges of six selected countries: China, Iran, Mexico, Nigeria, Russia, and the United Kingdom. Students compare the effectiveness of approaches to many global issues by examining how different governments solve similar problems. They will also engage in disciplinary practices that require them to read and interpret data, make comparisons and applications, and develop evidence-based arguments."},{id:"ap-european-history",name:"AP European History",code:"SS452",dept:"Social Studies",group:"Electives",level:"AP",grades:[11,12],credits:[1],prereq:"World History",flags:["Elective"],summary:"AP European History is an in-depth analysis of the period from 1450 to the present. In addition to the basic narrative of events and movements, the goals of the program are to develop an understanding of principal themes in modern European history, an ability to analyze historical evidence and an ability to express that understanding and analysis in writing. Material is presented in a seminar style. Students are expected to carefully read assigned materials and actively participate in class discussion. Both the reading level and the subject matter of materials used are college level. It is assumed that students entering the class have completed high school world history and are already familiar with basic chronology and terminology. At the end of the course, students will be prepared to take the Advanced Placement European History exam."},{id:"ap-psychology",name:"AP Psychology",code:"SS437",dept:"Social Studies",group:"Electives",level:"AP",grades:[11,12],credits:[.5],prereq:"None",note:"Beginning in the fall of 2022, this will be a .5 credit, 1 semester course.",flags:["Elective"],summary:"The Psychology AP course is designed to introduce students to the systematic and scientific study of the behavior and mental processes of human beings and other animals. Students are exposed to the psychological facts, principles, and phenomena associated with each of the major subfields within psychology. They also learn about the ethics and methods psychologists use in their practice. This course serves as preparation for the AP Exam given in May."},{id:"history-of-rock-roll",name:"History of Rock & Roll",code:"SS451",dept:"Social Studies",group:"Electives",level:"On-level",grades:[9,10,11,12],credits:[.5],prereq:"None",flags:["Elective"],summary:"This course will take a humanities approach in the study of Rock & Roll, from its origins in blues to its development into heavy metal and hip-hop. Music, history, and literature will come together to illustrate the social and political context from which the different genres within Rock & Roll emerged. Areas of exploration will include tracing the emergence of this distinctly American music form from its roots in gospel, blues, country, and jazz; the expression of the generation gap in the 1960's through soul and the British Invasion; a survey of the music that reflected both disillusionment and hope for change in the Vietnam era; and the ongoing fragmentation as seen in sub-genres such as punk, arena rock, grunge, and hip-hop."},{id:"model-united-nations-sptss",name:"Model United Nations - (Sptss)",dept:"Social Studies",group:"Electives",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",flags:["Elective"],summary:`Model UN 1 SS455 A/B

Model UN 2 SS456 A/B

Model UN 3 SS457 A/B

Model UN 4 SS458 A/B

Model United Nations is a research-based class in which students will build critical thinking and analysis skills to successfully participate in Model United Nations simulations. In Model United Nations, students are assigned countries to represent in committees with assigned topics that reflect current or historical issues within the framework of what the United Nations Committee might discuss. Students must research extensively to understand the background of the issue itself, as well as how their assigned nation has acted or responded in relation to the topic. In the course we will look at major bodies of the UN, issues they have addressed both past and current, and prepare for a mock conference with guidance in research skills, public speaking, written argumentation, collaboration, and negotiation. The ultimate goal in Model UN is to collaborate with others to build consensus and write resolutions to solve these world issues in pragmatic ways.`},{id:"psychology-i",name:"Psychology I",code:"SS440",dept:"Social Studies",group:"Electives",level:"On-level",grades:[9,10,11,12],credits:[.5],prereq:"None",flags:["Elective"],summary:"This course is an introduction and general overview of psychology; the scientific study of mental processes and behaviors. Students will study research methods used in psychology, the history of the field, and other units such as the states of consciousness, conditioning, learning and memory, developmental psychology, and abnormal psychology. Students will use a textbook as well as related articles, films and other media that illustrate these concepts."},{id:"sociology",name:"Sociology",code:"SS445",dept:"Social Studies",group:"Electives",level:"On-level",grades:[9,10,11,12],credits:[.5],prereq:"None",flags:["Elective"],summary:"Sociology is the scientific study of social structure and patterned human behavior. Students will understand the origins, theoretical perspectives, and research methods applied in this social science. Students will apply this knowledge to analyze human interactions in such social settings as families, education, political and economic institutions, and religious organizations. Students will also study how these groups are affected by culture, socioeconomic status, gender, and race. The class will emphasize discussion and participation, reading from sources in the subject, and seeing sociological concepts illustrated in film and media."},{id:"student-council-leadership",name:"Student Council/Leadership",code:"SS464",dept:"Social Studies",group:"Electives",level:"On-level",grades:[10,11,12],credits:[1],prereq:"Student Council Executive Board members of the Student Council Executive Board, including the elected Senior Class Officers and the current Student Body President and Vice President, will be assigned a class period to meet with their sponsor and conduct Student Council business. This class may be taken only once for graduation credit and is typically limited to Senior Leadership. With sponsor approval, exceptions may be made for Juniors serving on the Student Council Cabinet",flags:["Elective"],summary:"A student who is elected to the Student Council as an officer will have an assigned period during the day to meet with the Council sponsor to conduct the business of the Student Council. The duties and responsibilities of an officer may be obtained from a Student Council sponsor. This class may only be taken one time for state credit toward graduation."},{id:"teen-teaching-i",name:"Teen Teaching I",code:"TC460",dept:"Social Studies",group:"Electives",level:"On-level",grades:[11],credits:[1],prereq:"Completed Application, Teacher Approval and References Required",flags:["Elective"],summary:"The primary objective of Teen Teaching is to develop student's leadership skills through involvement in small group activities with elementary and middle school students and allow them to see the impact they have as positive role models within the EISD community. Students serve as mentors to younger students, prepare and teach lessons in elementary classrooms, and provide leadership at Live Oak Adventure and the Pace Bend Expedition. Students will develop and practice leadership and communication skills, group dynamics, positive role modeling, discussion facilitation, and methods of establishing and maintaining relationships based on respect and trust. Each student must make and keep a drug/alcohol/tobacco free commitment to remain a part of the program and be involved in Live Oak Adventure and the Pace Bend Expedition."},{id:"teen-teaching-ii",name:"Teen Teaching II",code:"TC461",dept:"Social Studies",group:"Electives",level:"On-level",grades:[12],credits:[1],prereq:"Completed Application, Teacher Approval and References Required",flags:["Elective"],summary:"Teen Teaching II is a continuation of the application of skills learned in Teen Teaching I. Students will continue to serve as mentors to younger students, prepare and teach lessons in elementary classrooms, and provide leadership at Live Oak Adventure and the Pace Bend Expedition. Students will continue to develop and practice leadership and communication skills, group dynamics, positive role modeling, discussion facilitation, and methods of establishing and maintaining relationships based on respect and trust. Special emphasis is placed on leadership in peer assistance programs. Each student must make and keep a drug/alcohol/tobacco free commitment to remain a part of the program and be involved in Live Oak Adventure and the Pace Bend Expedition."},{id:"american-sign-language-i",name:"American Sign Language I",code:"FL642",dept:"World Languages",group:"American Sign Language",level:"On-level",grades:[9,10,11,12],credits:[1],prereq:"None",summary:`American Sign Language (ASL) is a highly visually structured language. It is the third most studied language in America. This course is an introduction to the basic skills in developing production and comprehension skills in American Sign Language (ASL). Students will learn ASL vocabulary, structure, and grammar. Course content also includes the manual alphabet and numbers. Students will develop basic conversational abilities, and culturally appropriate behaviors, and learn about the culture and history of Deaf communities. Students are required to communicate with Deaf ASL teachers and their peers by gesturing, signing, and with minimal writing at all times in the classroom. Speaking verbally is not permitted in the classroom. Students are required to do ASL expressive assignments and presentations in class and do a daily review of signing at home using ASL videos provided by the ASL teachers. Students will be graded on their receptive and expressive abilities and their knowledge of Deaf Culture. Class participation is essential for the development of beginner's signing proficiency. Students must be willing to sign in the classroom.

Students can interact with Deaf children and adults by attending the ASL Club and community events. ASL is accepted as a foreign language credit for many colleges.`},{id:"american-sign-language-ii",name:"American Sign Language II",code:"FL643",dept:"World Languages",group:"American Sign Language",level:"On-level",grades:[10,11,12],credits:[1],prereq:"American Sign Language I",summary:`This course is an introduction to the basic skills in developing production and comprehension skills in American Sign Language (ASL). Students will learn ASL vocabulary, structure, and grammar. Course content also includes the manual alphabet and numbers. Students will develop basic conversational abilities, and culturally appropriate behaviors, and learn about the culture and history of Deaf communities. Students will further refine their conversational abilities, and culturally appropriate behaviors, and learn about the culture and history of Deaf communities. Active participation by the student is an essential part of the course. ASL is exclusively the language of the classroom. Speaking verbally is not permitted in the classroom. Students who do not wish to use only American Sign Language in the classroom should not sign up for this course. This course requires daily practice, including actively engaging in classwork and completing daily homework assignments. Class participation is essential for the development of intermediate signing proficiency. Students must be willing to sign in the classroom. Students are required to do ASL expressive assignments and presentations in class, academic research and reaction papers, and do a daily review of signing outside of the classroom. Students will be graded on their receptive and expressive abilities and knowledge of Deaf Culture.

Students can interact with Deaf children and adults by attending the ASL Club and community events. ASL is accepted as a foreign language credit for many colleges.`},{id:"american-sign-language-iii-honors",name:"American Sign Language III Honors",code:"FL645H",dept:"World Languages",group:"American Sign Language",level:"Honors",grades:[11,12],credits:[1],prereq:"American Sign Language II",flags:["New Course"],summary:"American Sign Language 3 Honors focuses on the concentrated practice of the language. This course is a continuation of intermediate skills in developing production and comprehension skills in American Sign Language (ASL). Students will learn ASL vocabulary, structure, and grammar. Course content also includes the manual alphabet and numbers. Students will develop and refine intermediate conversational abilities, and culturally appropriate behaviors, and learn about the culture and history of Deaf communities. Active participation by the student is an essential part of the course. ASL is exclusively the language of the classroom. Speaking verbally is not permitted in the classroom. Students who do not wish to use only American Sign Language in the classroom should not sign up for this course. Emphasis is placed on the student's communicative skills and fluency. The four language skills of visual receptive listening, expressively signing, reading, and writing ASL grammar to English will continue to be developed as well as a better understanding of Deaf Culture and history. Historically, students who are willing to work nightly for up to an hour and occasionally more, have been successful in American Sign Language 3 Honors & 4 Honors. Students with outstanding academic achievement in ASL studies may qualify for honors by the American Sign Language Honor Society. Students can interact with Deaf children and adults by attending the ASL Club and community events. ASL is accepted as a foreign language credit for many colleges."},{id:"american-sign-language-iv-honors",name:"American Sign Language IV Honors",code:"FL641H",dept:"World Languages",group:"American Sign Language",level:"Honors",grades:[11,12],credits:[1],prereq:"American Sign Language III",flags:["New Course"],summary:"American Sign Language 4 Honors prepares the student for advanced communication with Deaf signers in the Deaf Community through intensive practice of the four language skills of visual receptive listening, expressively signing, reading, and writing ASL grammar to English. Active participation by the student is an essential part of the course. ASL is exclusively the language of the classroom. Speaking verbally is not permitted in the classroom. Students who do not wish to use only American Sign Language in the classroom should not sign up for this course. There will be an emphasis on interpreting skills from ASL to English and vice versa. The student must develop a strong background in ASL which will serve as the basis for new learning. Students are required to produce a major written work. Students with outstanding academic achievement in ASL studies may qualify for honors by the American Sign Language Honor Society. Students will have the opportunity to interact with Deaf children and adults by attending the ASL Club and community events. ASL is accepted as a foreign language credit for many colleges. Students who wish to become certified ASL interpreters can continue with the TWA curriculum at the college level which leads to the college's interpreting program."},{id:"ap-chinese-language-and-culture-level-iv",name:"AP Chinese Language and Culture (Level IV)",code:"FL649",dept:"World Languages",group:"Chinese",level:"AP",grades:[11,12],credits:[1],prereq:"Credit for Chinese III",summary:"AP Chinese Language and Culture is considered an advanced Chinese language course. This course will challenge students to build up a more complex vocabulary, focus on important linguistic grammar structures and continue to make complex phrases and sentences. The goal of this course is to deepen students' immersion into the language and culture of the Chinese-speaking world. The course engages students in an exploration of both contemporary and historical Chinese culture. The students will be able to write Chinese sentences and essays, participate in fluent Chinese conversations, and read short Chinese stories with confidence. This course prepares students to demonstrate their level of Chinese proficiency across the three communicative modes: interpersonal, interpretive, and presentational. The AP Chinese exam formats will be reviewed in the class."},{id:"chinese-5-6-advanced",name:"Chinese 5/6 Advanced",code:"FL650",dept:"World Languages",group:"Chinese",level:"Post AP",grades:[11,12],credits:[1],prereq:"Chinese IV AP",flags:["Post AP"],summary:'This course is a project-based course that is designed to introduce three of the major genres of Chinese literature—poetry, fiction and drama. We will read a number of the "masterworks" of Chinese literature. We will also examine the intertextuality between these genres — how poetry blends into narrative, how fiction becomes drama, and drama inspires fiction. Through reading these selected works of Chinese literature, we will examine some of the major features of Chinese society: religious and philosophical beliefs, the imperial system and dynastic change, gender relations, notions of class and ethnicity, family, and romance. This course seeks not only to introduce students to highlights from the canon of Chinese literature, but also in contemporary Chinese societies and in the global Chinese diaspora. Student projects will focus on contemporary media adaptations of famous Chinese literary works (in film, anime, comic books, computer games, websites, music, theater, art, and other media). In this school year, student will complete several literature and culture related project to deepen their understanding of the impact between language, culture and society. These courses receive
